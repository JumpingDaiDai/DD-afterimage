<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>⏳ 殘像 (Afterimage) - Demo</title>
  <style>
    :root {
      --bg: #070913;
      --primary: #38bdf8;
      --accent: #ec4899;
      --gold: #facc15;
      --purple: #a855f7;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      color: #fff;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    /* 懸浮 HUD 介面 */
    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 12px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bar-container {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 3px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 170px;
    }
    .bar-label { font-size: 11px; font-weight: 800; color: #94a3b8; width: 28px; }
    .bar-track {
      flex: 1;
      height: 8px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }
    .hp-fill { background: linear-gradient(90deg, #ef4444, #f43f5e); }
    .exp-fill { background: linear-gradient(90deg, #06b6d4, #38bdf8); }
    .hud-right {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 6px 14px;
      text-align: right;
      pointer-events: auto;
    }
    .score-text { font-size: 16px; font-weight: 800; color: var(--gold); }
    .timer-text { font-size: 12px; color: #cbd5e1; font-family: monospace; }
    .doc-link {
      font-size: 11px;
      color: var(--primary);
      text-decoration: none;
      display: inline-block;
      margin-top: 2px;
      font-weight: bold;
    }

    /* 單手提示標籤 */
    .tip-toast {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(8px);
      color: #94a3b8;
      font-size: 11px;
      padding: 6px 16px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
    }
    .tip-toast strong { color: var(--primary); }

    /* 動態跟隨虛擬搖桿 (支援任意點觸控生成) */
    #dynamic-joy {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08), rgba(255, 255, 255, 0.02));
      border: 1.5px dashed rgba(56, 189, 248, 0.35);
      pointer-events: none;
      display: none;
      z-index: 20;
      transform: translate(-50%, -50%);
    }
    #dynamic-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary), #0284c7);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.7);
      transform: translate(-50%, -50%);
    }

    /* 升級三選一彈窗 */
    .upgrade-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 9, 19, 0.85);
      backdrop-filter: blur(12px);
      z-index: 50;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .upgrade-modal.active { display: flex; }
    .upgrade-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.5);
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 380px;
    }
    .upgrade-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .upgrade-card:hover, .upgrade-card:active {
      border-color: var(--primary);
      transform: translateY(-2px);
      background: #243248;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
    }
    .card-icon { font-size: 32px; }
    .card-info h4 { font-size: 15px; color: #fff; margin-bottom: 4px; }
    .card-info p { font-size: 12px; color: #94a3b8; }

    /* 遊戲結束彈窗 */
    .gameover-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 9, 19, 0.9);
      backdrop-filter: blur(12px);
      z-index: 60;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .gameover-modal.active { display: flex; }
    .btn-restart {
      margin-top: 20px;
      background: var(--primary);
      color: #0b0f19;
      font-size: 16px;
      font-weight: 800;
      padding: 12px 32px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- 頂部 HUD -->
  <div class="hud">
    <div class="hud-left">
      <div class="bar-container">
        <span class="bar-label">HP</span>
        <div class="bar-track"><div id="hp-bar" class="bar-fill hp-fill"></div></div>
      </div>
      <div class="bar-container">
        <span class="bar-label">LV.<span id="level-num">1</span></span>
        <div class="bar-track"><div id="exp-bar" class="bar-fill exp-fill" style="width: 0%;"></div></div>
      </div>
    </div>
    <div class="hud-right">
      <div class="score-text">💀 <span id="kill-count">0</span></div>
      <div class="timer-text" id="time-display">00:00</div>
      <a href="manual.html" class="doc-link">📖 玩法手冊</a>
    </div>
  </div>

  <!-- 操作指引提示 -->
  <div class="tip-toast">
    👆 <strong>雙擊螢幕</strong>：回溯召喚殘像 ｜ 🎯 <strong>點擊殘像</strong>：飛雷神換位 ｜ 🖐️ <strong>鬆手</strong>：定點射擊
  </div>

  <!-- 動態跟隨搖桿 -->
  <div id="dynamic-joy">
    <div id="dynamic-knob"></div>
  </div>

  <!-- 升級彈窗 -->
  <div id="upgrade-modal" class="upgrade-modal">
    <div class="upgrade-title">⚡ 選擇時空突破天賦</div>
    <div id="card-list" class="card-list"></div>
  </div>

  <!-- 結算彈窗 -->
  <div id="gameover-modal" class="gameover-modal">
    <h2 style="font-size: 28px; color: #ef4444; margin-bottom: 8px;">💀 時空線崩塌</h2>
    <p style="color: #94a3b8; font-size: 14px;">你在時空狂潮中堅持了 <span id="final-time" style="color: #fff; font-weight: bold;"></span></p>
    <p style="color: #94a3b8; font-size: 14px; margin-top: 4px;">消滅異變體：<span id="final-kills" style="color: var(--gold); font-weight: bold;"></span></p>
    <button class="btn-restart" onclick="location.reload()">🔄 重啟時間線</button>
  </div>

  <script>
    // --- 遊戲核心引擎 ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    // 視窗自適應
    let width = 0, height = 0;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 遊戲狀態
    const STATE = {
      isPaused: false,
      isGameOver: false,
      gameTime: 0,
      kills: 0,
      level: 1,
      exp: 0,
      maxExp: 10,
      shake: 0
    };

    // 音效合成系統 (Web Audio)
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      playLaser() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      },
      playHit() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      playRewind() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      },
      playSwap() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.setValueAtTime(800, this.ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      },
      playGem() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900, this.ctx.currentTime);
        osc.frequency.setValueAtTime(1400, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
    };
    window.addEventListener('pointerdown', () => AudioEngine.init(), { once: true });

    // 玩家配置
    const player = {
      x: width / 2,
      y: height / 2,
      radius: 16,
      speed: 3.2,
      hp: 100,
      maxHp: 100,
      attackCd: 0,
      attackSpeed: 18,
      shootCount: 1,
      invulnerable: 0,
      echoCd: 0,
      maxEchoCd: 240, // 4 秒 CD
      maxEchoCount: 2, // 支援最多 2 個殘像（連成三角形結界！）
      history: [],
      maxHistory: 180, // 3 秒歷史
      resonanceDmg: 0.8,
      orbitalBlade: 0,
      bladeAngle: 0
    };

    // 實體管理
    const echoes = [];
    const bullets = [];
    const enemies = [];
    const gems = [];
    const particles = [];
    const popups = [];

    // 鍵盤輸入
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.code === 'Space') triggerEcho();
      if (e.key.toLowerCase() === 'q') swapWithFirstEcho();
    });
    window.addEventListener('keyup', e => {
      keys[e.key.toLowerCase()] = false;
    });

    // --- 極致單手手勢系統 (全螢幕動態搖桿 + 雙擊回溯 + 點擊殘像換位) ---
    const joyContainer = document.getElementById('dynamic-joy');
    const joyKnob = document.getElementById('dynamic-knob');
    let touchOrigin = null;
    let joyVec = { x: 0, y: 0 };
    let lastTapTime = 0;
    let touchStartTime = 0;
    let activePointerId = null;

    window.addEventListener('pointerdown', e => {
      // 排除 UI 點擊
      if (e.target.closest('.hud-right') || e.target.closest('.upgrade-modal') || e.target.closest('.gameover-modal')) return;
      AudioEngine.init();

      const now = performance.now();
      const clickX = e.clientX;
      const clickY = e.clientY;

      // 1. 檢測是否點擊在「場上的殘像」周圍（換位 Swap 判定，容錯半徑 45px）
      let clickedEcho = null;
      for (const ec of echoes) {
        if (Math.hypot(clickX - ec.x, clickY - ec.y) < player.radius + 35) {
          clickedEcho = ec;
          break;
        }
      }

      if (clickedEcho) {
        // 執行換位！
        swapWithEcho(clickedEcho);
        return;
      }

      // 2. 檢測是否為「雙擊（Double Tap）」回溯
      if (now - lastTapTime < 280) {
        triggerEcho();
        lastTapTime = 0; // 重置防止三連擊
        return;
      }
      lastTapTime = now;

      // 3. 正常搖桿啟動（在手指按下的位置動態生成搖桿）
      activePointerId = e.pointerId;
      touchStartTime = now;
      touchOrigin = { x: clickX, y: clickY };
      joyVec = { x: 0, y: 0 };

      joyContainer.style.left = `${clickX}px`;
      joyContainer.style.top = `${clickY}px`;
      joyKnob.style.transform = 'translate(-50%, -50%)';
      joyContainer.style.display = 'block';
    });

    window.addEventListener('pointermove', e => {
      if (touchOrigin && e.pointerId === activePointerId) {
        const dx = e.clientX - touchOrigin.x;
        const dy = e.clientY - touchOrigin.y;
        const dist = Math.hypot(dx, dy);
        const maxR = 40;
        const angle = Math.atan2(dy, dx);
        const clamped = Math.min(dist, maxR);

        joyVec.x = (clamped / maxR) * Math.cos(angle);
        joyVec.y = (clamped / maxR) * Math.sin(angle);

        joyKnob.style.transform = `translate(calc(-50% + ${Math.cos(angle) * clamped}px), calc(-50% + ${Math.sin(angle) * clamped}px))`;
      }
    });

    function resetTouch() {
      touchOrigin = null;
      activePointerId = null;
      joyVec = { x: 0, y: 0 };
      joyContainer.style.display = 'none';
    }
    window.addEventListener('pointerup', resetTouch);
    window.addEventListener('pointercancel', resetTouch);

    // 觸發時空裂影回溯
    function triggerEcho() {
      if (player.echoCd > 0 || player.history.length < 25) return;
      AudioEngine.playRewind();
      STATE.shake = 10;

      // 取得 3 秒前狀態
      const oldState = player.history[0];
      const recordedActions = [...player.history];

      // 若達到殘像上限，移除最早生成的殘像
      if (echoes.length >= player.maxEchoCount) {
        echoes.shift();
      }

      // 生成殘像 (在目前位置留存)
      echoes.push({
        frames: recordedActions,
        currentFrame: 0,
        x: player.x,
        y: player.y,
        alpha: 0.85,
        maxLife: recordedActions.length
      });

      // 玩家瞬移回 3 秒前
      player.x = oldState.x;
      player.y = oldState.y;
      player.invulnerable = 40; // 0.65 秒無敵
      player.echoCd = player.maxEchoCd;
      player.history = []; // 重置當前軌跡

      // 躍遷粒子
      for (let i = 0; i < 20; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 4;
        particles.push({
          x: player.x, y: player.y,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          life: 25, color: '#38bdf8', size: 3
        });
      }
    }

    // 與指定殘像換位 (Swap)
    function swapWithEcho(targetEcho) {
      AudioEngine.playSwap();
      STATE.shake = 8;

      const px = player.x;
      const py = player.y;

      // 交換座標
      player.x = targetEcho.x;
      player.y = targetEcho.y;
      targetEcho.x = px;
      targetEcho.y = py;

      player.invulnerable = 20; // 換位給予 0.3 秒無敵

      // 在兩點之間產生換位時空裂縫粒子
      for (let i = 0; i < 15; i++) {
        const t = Math.random();
        particles.push({
          x: px + (player.x - px) * t,
          y: py + (player.y - py) * t,
          vx: (Math.random() - 0.5) * 3,
          vy: (Math.random() - 0.5) * 3,
          life: 20, color: '#facc15', size: 3.5
        });
      }
    }

    function swapWithFirstEcho() {
      if (echoes.length > 0) swapWithEcho(echoes[0]);
    }

    // 升級天賦
    const UPGRADES = [
      { id: 'multishot', title: '雙重散射', desc: '主武器發射彈幕數 +1', icon: '🔫', apply: () => player.shootCount++ },
      { id: 'attackspeed', title: '超頻加速', desc: '攻擊間隔縮短 25%', icon: '⚡', apply: () => player.attackSpeed = Math.max(8, player.attackSpeed * 0.75) },
      { id: 'resonance', title: '共振光刃', desc: '殘像連線/結界雷射傷害 +50%', icon: '💠', apply: () => player.resonanceDmg += 0.5 },
      { id: 'multiecho', title: '多重鏡像', desc: '殘像上限 +1（拉出多邊形三角殺陣！）', icon: '👥', apply: () => player.maxEchoCount++ },
      { id: 'orbital', title: '軌道切割刃', desc: '身邊新增一枚防護光刃', icon: '🌀', apply: () => player.orbitalBlade++ },
      { id: 'cooldown', title: '時空壓縮', desc: '裂影回溯冷卻時間 -25%', icon: '⏳', apply: () => player.maxEchoCd = Math.max(90, player.maxEchoCd * 0.75) },
      { id: 'heal', title: '奈米修復', desc: '立即恢復 40 點生命值', icon: '💖', apply: () => player.hp = Math.min(player.maxHp, player.hp + 40) }
    ];

    function showUpgradeModal() {
      STATE.isPaused = true;
      const modal = document.getElementById('upgrade-modal');
      const list = document.getElementById('card-list');
      list.innerHTML = '';

      const shuffled = [...UPGRADES].sort(() => 0.5 - Math.random()).slice(0, 3);
      shuffled.forEach(item => {
        const card = document.createElement('div');
        card.className = 'upgrade-card';
        card.innerHTML = `
          <div class="card-icon">${item.icon}</div>
          <div class="card-info">
            <h4>${item.title}</h4>
            <p>${item.desc}</p>
          </div>
        `;
        card.onclick = () => {
          item.apply();
          modal.classList.remove('active');
          STATE.isPaused = false;
        };
        list.appendChild(card);
      });
      modal.classList.add('active');
    }

    // --- 遊戲主循環 ---
    let frameCount = 0;
    function update() {
      if (STATE.isPaused || STATE.isGameOver) return;
      frameCount++;
      STATE.gameTime++;

      // 1. 移動計算 (手指鬆開時 joyVec 為 0，本體原地停下)
      let moveX = 0, moveY = 0;
      if (keys['w'] || keys['arrowup']) moveY -= 1;
      if (keys['s'] || keys['arrowdown']) moveY += 1;
      if (keys['a'] || keys['arrowleft']) moveX -= 1;
      if (keys['d'] || keys['arrowright']) moveX += 1;

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        moveX = (moveX / len) * player.speed;
        moveY = (moveY / len) * player.speed;
      } else if (touchOrigin) {
        moveX = joyVec.x * player.speed;
        moveY = joyVec.y * player.speed;
      }

      player.x = Math.max(player.radius, Math.min(width - player.radius, player.x + moveX));
      player.y = Math.max(player.radius, Math.min(height - player.radius, player.y + moveY));

      // 紀錄軌跡 (Ring Buffer)
      player.history.push({ x: player.x, y: player.y, shooting: player.attackCd <= 0 });
      if (player.history.length > player.maxHistory) {
        player.history.shift();
      }

      // 冷卻計時
      if (player.invulnerable > 0) player.invulnerable--;
      if (player.echoCd > 0) player.echoCd--;

      // 2. 自動射擊最近敵人
      player.attackCd--;
      if (player.attackCd <= 0 && enemies.length > 0) {
        let nearest = null, minDist = Infinity;
        for (const e of enemies) {
          const d = Math.hypot(e.x - player.x, e.y - player.y);
          if (d < minDist) { minDist = d; nearest = e; }
        }
        if (nearest) {
          const baseAng = Math.atan2(nearest.y - player.y, nearest.x - player.x);
          const spread = 0.15;
          const startOffset = -(player.shootCount - 1) * spread / 2;
          for (let i = 0; i < player.shootCount; i++) {
            const ang = baseAng + startOffset + i * spread;
            bullets.push({
              x: player.x, y: player.y,
              vx: Math.cos(ang) * 9, vy: Math.sin(ang) * 9,
              damage: 18, life: 60, isEcho: false
            });
          }
          AudioEngine.playLaser();
          player.attackCd = player.attackSpeed;
        }
      }

      // 3. 殘像更新與重播
      for (let i = echoes.length - 1; i >= 0; i--) {
        const ec = echoes[i];
        if (ec.currentFrame < ec.frames.length) {
          const record = ec.frames[ec.currentFrame];
          ec.x = record.x;
          ec.y = record.y;
          ec.currentFrame++;

          // 殘像自動開火
          if (record.shooting && enemies.length > 0) {
            let nearest = null, minDist = Infinity;
            for (const e of enemies) {
              const d = Math.hypot(e.x - ec.x, e.y - ec.y);
              if (d < minDist) { minDist = d; nearest = e; }
            }
            if (nearest) {
              const ang = Math.atan2(nearest.y - ec.y, nearest.x - ec.x);
              bullets.push({
                x: ec.x, y: ec.y,
                vx: Math.cos(ang) * 8, vy: Math.sin(ang) * 8,
                damage: 14, life: 55, isEcho: true
              });
            }
          }
        } else {
          // 殘像消散
          for (let p = 0; p < 18; p++) {
            const ang = Math.random() * Math.PI * 2;
            particles.push({
              x: ec.x, y: ec.y,
              vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4,
              life: 25, color: '#a855f7', size: 3
            });
          }
          echoes.splice(i, 1);
        }
      }

      // 殘像雷射割裂與多邊形結界判定
      if (echoes.length === 1) {
        // 單殘像：直線雷射
        const ec = echoes[0];
        for (const enemy of enemies) {
          if (pointToSegmentDist(enemy.x, enemy.y, player.x, player.y, ec.x, ec.y) < enemy.radius + 6) {
            enemy.hp -= player.resonanceDmg;
            enemy.flash = 2;
          }
        }
      } else if (echoes.length >= 2) {
        // 雙殘像以上：三角形/多邊形封閉結界！
        const poly = [{ x: player.x, y: player.y }, ...echoes.map(e => ({ x: e.x, y: e.y }))];
        for (const enemy of enemies) {
          // 檢查怪物是否在多邊形內部
          if (isPointInPolygon({ x: enemy.x, y: enemy.y }, poly)) {
            enemy.hp -= player.resonanceDmg * 1.5; // 結界內部 1.5 倍高頻湮滅傷害
            enemy.flash = 2;
            if (Math.random() < 0.25) {
              particles.push({
                x: enemy.x, y: enemy.y,
                vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                life: 12, color: '#facc15', size: 2.5
              });
            }
          }
        }
      }

      // 軌道光刃
      if (player.orbitalBlade > 0) {
        player.bladeAngle += 0.05;
        const bladeDist = 55;
        for (let b = 0; b < player.orbitalBlade; b++) {
          const ang = player.bladeAngle + (b * (Math.PI * 2 / player.orbitalBlade));
          const bx = player.x + Math.cos(ang) * bladeDist;
          const by = player.y + Math.sin(ang) * bladeDist;
          for (const e of enemies) {
            if (Math.hypot(e.x - bx, e.y - by) < e.radius + 10) {
              e.hp -= 1.2;
              e.flash = 2;
            }
          }
        }
      }

      // 4. 子彈更新
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        for (const e of enemies) {
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + 4) {
            e.hp -= b.damage;
            e.flash = 3;
            AudioEngine.playHit();
            popups.push({ x: e.x, y: e.y - 10, text: b.damage, life: 25, color: b.isEcho ? '#ec4899' : '#38bdf8' });
            b.life = 0;
            break;
          }
        }
        if (b.life <= 0) bullets.splice(i, 1);
      }

      // 5. 怪物生成與更新
      const spawnInterval = Math.max(20, 65 - Math.floor(STATE.gameTime / 300));
      if (frameCount % spawnInterval === 0) {
        const edge = Math.floor(Math.random() * 4);
        let ex = 0, ey = 0;
        if (edge === 0) { ex = Math.random() * width; ey = -20; }
        else if (edge === 1) { ex = width + 20; ey = Math.random() * height; }
        else if (edge === 2) { ex = Math.random() * width; ey = height + 20; }
        else { ex = -20; ey = Math.random() * height; }

        enemies.push({
          x: ex, y: ey,
          radius: 13,
          speed: 1.2 + Math.random() * 0.8,
          hp: 25 + Math.floor(STATE.gameTime / 400) * 10,
          maxHp: 25 + Math.floor(STATE.gameTime / 400) * 10,
          flash: 0
        });
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.flash > 0) e.flash--;

        // 追逐目標（殘像存在時有 50% 機率被殘像吸引）
        let target = player;
        if (echoes.length > 0 && i % 2 === 0) {
          target = echoes[0];
        }

        const angle = Math.atan2(target.y - e.y, target.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        // 撞擊玩家
        if (Math.hypot(e.x - player.x, e.y - player.y) < e.radius + player.radius) {
          if (player.invulnerable <= 0) {
            player.hp -= 12;
            player.invulnerable = 30;
            STATE.shake = 8;
            AudioEngine.playHit();
            if (player.hp <= 0) {
              player.hp = 0;
              gameOver();
            }
          }
        }

        // 怪物死亡
        if (e.hp <= 0) {
          STATE.kills++;
          gems.push({ x: e.x, y: e.y, exp: 2 });
          for (let p = 0; p < 8; p++) {
            const ang = Math.random() * Math.PI * 2;
            particles.push({
              x: e.x, y: e.y,
              vx: Math.cos(ang) * 3, vy: Math.sin(ang) * 3,
              life: 20, color: '#f43f5e', size: 2.5
            });
          }
          enemies.splice(i, 1);
        }
      }

      // 6. 經驗晶體拾取
      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const dist = Math.hypot(player.x - g.x, player.y - g.y);
        if (dist < 120) {
          const ang = Math.atan2(player.y - g.y, player.x - g.x);
          g.x += Math.cos(ang) * 6;
          g.y += Math.sin(ang) * 6;
        }
        if (dist < player.radius + 8) {
          STATE.exp += g.exp;
          AudioEngine.playGem();
          if (STATE.exp >= STATE.maxExp) {
            STATE.level++;
            STATE.exp -= STATE.maxExp;
            STATE.maxExp = Math.floor(STATE.maxExp * 1.4);
            showUpgradeModal();
          }
          gems.splice(i, 1);
        }
      }

      // 7. 粒子與飄字
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) {
        const pu = popups[i];
        pu.y -= 0.8;
        pu.life--;
        if (pu.life <= 0) popups.splice(i, 1);
      }

      // 8. 更新 DOM UI
      document.getElementById('hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
      document.getElementById('exp-bar').style.width = `${(STATE.exp / STATE.maxExp) * 100}%`;
      document.getElementById('level-num').innerText = STATE.level;
      document.getElementById('kill-count').innerText = STATE.kills;

      const sec = Math.floor(STATE.gameTime / 60);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      document.getElementById('time-display').innerText = `${mm}:${ss}`;
    }

    // 幾何計算工具
    function pointToSegmentDist(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    function isPointInPolygon(point, vs) {
      let x = point.x, y = point.y;
      let inside = false;
      for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        let xi = vs[i].x, yi = vs[i].y;
        let xj = vs[j].x, yj = vs[j].y;
        let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // --- 渲染畫面 ---
    function render() {
      ctx.save();
      if (STATE.shake > 0) {
        ctx.translate((Math.random() - 0.5) * STATE.shake, (Math.random() - 0.5) * STATE.shake);
        STATE.shake *= 0.88;
        if (STATE.shake < 0.5) STATE.shake = 0;
      }

      ctx.clearRect(0, 0, width, height);

      // 背景網格
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }

      // 1. 繪製殘像與結界
      if (echoes.length >= 2) {
        // 多邊形半透明結界覆蓋
        ctx.save();
        ctx.fillStyle = 'rgba(236, 72, 153, 0.15)';
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = '#ec4899';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        for (const ec of echoes) {
          ctx.lineTo(ec.x, ec.y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      } else if (echoes.length === 1) {
        // 單條連線雷射
        ctx.save();
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 3 + Math.sin(frameCount * 0.2) * 1.5;
        ctx.shadowColor = '#ec4899';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(echoes[0].x, echoes[0].y);
        ctx.stroke();
        ctx.restore();
      }

      // 殘像本體與換位指示圈
      for (const ec of echoes) {
        ctx.save();
        // 外層換位提示呼吸圈
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(ec.x, ec.y, player.radius + 10 + Math.sin(frameCount * 0.15) * 3, 0, Math.PI * 2);
        ctx.stroke();

        // 殘像主體
        ctx.fillStyle = 'rgba(236, 72, 153, 0.45)';
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#ec4899';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(ec.x, ec.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 換位圖示
        ctx.font = '10px sans-serif';
        ctx.fillStyle = '#facc15';
        ctx.textAlign = 'center';
        ctx.fillText('SWAP', ec.x, ec.y - player.radius - 14);
        ctx.restore();
      }

      // 2. 經驗晶體
      for (const g of gems) {
        ctx.save();
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(g.x, g.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 3. 怪物
      for (const e of enemies) {
        ctx.save();
        ctx.fillStyle = e.flash > 0 ? '#fff' : '#f43f5e';
        ctx.strokeStyle = '#9f1239';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#f43f5e';
        ctx.shadowBlur = e.flash > 0 ? 12 : 4;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (e.hp < e.maxHp) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(e.x - 12, e.y - 18, 24, 4);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(e.x - 12, e.y - 18, (e.hp / e.maxHp) * 24, 4);
        }
        ctx.restore();
      }

      // 4. 子彈
      for (const b of bullets) {
        ctx.save();
        ctx.fillStyle = b.isEcho ? '#ec4899' : '#38bdf8';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 5. 軌道光刃
      if (player.orbitalBlade > 0) {
        const bladeDist = 55;
        for (let b = 0; b < player.orbitalBlade; b++) {
          const ang = player.bladeAngle + (b * (Math.PI * 2 / player.orbitalBlade));
          const bx = player.x + Math.cos(ang) * bladeDist;
          const by = player.y + Math.sin(ang) * bladeDist;
          ctx.save();
          ctx.fillStyle = '#facc15';
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(bx, by, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // 6. 玩家本體
      ctx.save();
      if (player.invulnerable > 0 && Math.floor(frameCount / 4) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }
      ctx.fillStyle = '#38bdf8';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 7. 粒子效果
      for (const p of particles) {
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 25;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 8. 傷害飄字
      for (const pu of popups) {
        ctx.save();
        ctx.font = 'bold 12px monospace';
        ctx.fillStyle = pu.color;
        ctx.globalAlpha = pu.life / 25;
        ctx.fillText(`-${pu.text}`, pu.x, pu.y);
        ctx.restore();
      }

      ctx.restore();
    }

    function gameOver() {
      STATE.isGameOver = true;
      const modal = document.getElementById('gameover-modal');
      const sec = Math.floor(STATE.gameTime / 60);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      document.getElementById('final-time').innerText = `${mm}:${ss}`;
      document.getElementById('final-kills').innerText = STATE.kills;
      modal.classList.add('active');
    }

    // 遊戲循環
    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
