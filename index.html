<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Afterimage">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#070913">
  <link rel="manifest" href="manifest.json">
  <title>AFTERIMAGE v0.0.15</title>
  <!-- 引入 Google Fonts: Syne (純英文字標) & Orbitron (科技副標/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Syne:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05020c;
      --primary: #38bdf8;
      --accent: #ec4899;
      --gold: #facc15;
      --purple: #a855f7;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-tap-highlight-color: transparent !important;
      touch-action: none;
    }
    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      color: #fff;
      touch-action: none;
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    /* 懸浮 HUD 介面 */
    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 12px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .bar-container {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 2px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 150px;
    }
    .bar-label { font-size: 10px; font-weight: 800; color: #94a3b8; width: 26px; }
    .bar-track {
      flex: 1;
      height: 6px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }
    .hp-fill { background: linear-gradient(90deg, #ef4444, #f43f5e); }
    .exp-fill { background: linear-gradient(90deg, #06b6d4, #38bdf8); }
    .ai-hp-fill { background: linear-gradient(90deg, #a855f7, #ec4899); }
    .duel-hud-center {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 4px 14px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .hud-right {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 4px 12px;
      text-align: right;
      pointer-events: auto;
    }
    .score-text { font-size: 13px; font-weight: 800; color: var(--gold); }
    .timer-text { font-size: 11px; color: #cbd5e1; font-family: monospace; }
    .doc-link {
      font-size: 10px;
      color: var(--primary);
      text-decoration: none;
      display: inline-block;
      margin-top: 2px;
      font-weight: bold;
    }

    /* 方案 A 控制區：經典手遊左搖桿 + 右側人體工學扇形雙技能鍵 */
    .controls-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      top: 0;
      z-index: 20;
      pointer-events: none;
    }
    .joystick-container {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 24px), 24px);
      left: max(env(safe-area-inset-left, 36px), 36px);
      pointer-events: auto;
    }
    #joystick-base {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08), rgba(15, 23, 42, 0.45));
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      position: relative;
      pointer-events: auto;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    #joystick-stick {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8, #0284c7);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.7);
      position: absolute;
      top: 32px;
      left: 32px;
      pointer-events: none;
      transform: translate(0px, 0px);
      transition: transform 0.05s ease-out;
    }
    /* 右側技能區：手遊經典右手大拇指自然弧線扇形配置 */
    .action-buttons {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 24px), 24px);
      right: max(env(safe-area-inset-right, 36px), 36px);
      width: 140px;
      height: 140px;
      pointer-events: none;
    }
    .btn-action {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      transition: transform 0.1s, opacity 0.2s;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .btn-action:active { transform: scale(0.92); }
    .btn-action.disabled {
      filter: grayscale(0.9);
      opacity: 0.35;
      pointer-events: none;
    }
    /* 主要技能：回溯 (大按鈕，位於拇指落點偏右下) */
    .btn-echo {
      width: 68px;
      height: 68px;
      bottom: 0px;
      right: 4px;
      background: radial-gradient(circle, #ec4899, #be185d);
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.7);
    }
    /* 次要技能：換位 (中按鈕，位於拇指上方自然伸展處) */
    .btn-swap {
      width: 56px;
      height: 56px;
      top: 4px;
      left: 6px;
      background: radial-gradient(circle, #facc15, #ca8a04);
      box-shadow: 0 0 16px rgba(250, 204, 21, 0.65);
    }
    .btn-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #38bdf8;
      color: #070913;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
      border: 1.5px solid #070913;
    }
    .btn-icon { font-size: 14px; font-weight: 900; }
    .btn-lbl { font-size: 10px; font-weight: 800; color: #fff; margin-top: 1px; }

    /* 升級三選一彈窗 (z-index 提高至 200，pointer-events: auto) */
    .upgrade-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 9, 19, 0.85);
      backdrop-filter: blur(12px);
      z-index: 200;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      pointer-events: auto;
    }
    .upgrade-modal.active { display: flex; }
    .upgrade-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 16px;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.5);
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 360px;
      pointer-events: auto;
    }
    .upgrade-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .upgrade-card:hover, .upgrade-card:active {
      border-color: var(--primary);
      transform: translateY(-2px);
      background: #243248;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
    }
    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }
    .card-icon svg {
      width: 24px;
      height: 24px;
      display: block;
    }
    .card-info h4 { font-size: 14px; color: #fff; margin-bottom: 2px; }
    .card-info p { font-size: 11px; color: #94a3b8; }

    /* 遊戲結束彈窗 (z-index 提高至 210，頂級毛玻璃 + 霓虹質感排版) */
    .gameover-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(30, 10, 20, 0.88), rgba(7, 9, 19, 0.98));
      backdrop-filter: blur(16px);
      z-index: 210;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      pointer-events: auto;
    }
    .gameover-modal.active { display: flex; }
    .gameover-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid rgba(239, 68, 68, 0.4);
      border-radius: 20px;
      padding: 28px 40px;
      box-shadow: 0 0 36px rgba(239, 68, 68, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 420px;
      width: 90%;
    }
    .gameover-title {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ef4444, #f43f5e, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(239, 68, 68, 0.6));
      margin-bottom: 20px;
    }
    .gameover-stats {
      display: flex;
      gap: 24px;
      margin-bottom: 28px;
      width: 100%;
      justify-content: center;
    }
    .stat-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 22px;
      font-weight: 900;
      font-family: monospace;
      color: #fff;
    }
    .stat-val.gold { color: var(--gold); text-shadow: 0 0 12px rgba(250, 204, 21, 0.5); }
    .stat-val.cyan { color: var(--primary); text-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }
    .btn-restart {
      background: linear-gradient(135deg, #ef4444, #be123c);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 14px 44px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      cursor: pointer;
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .btn-restart:active {
      transform: scale(0.94);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }
    /* 首頁 (Title / Home Screen) #1 幾何共振三芒星 (Resonance Trinity) 頂級沉浸排版 */
    .home-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 45%, #130a24 0%, #080314 55%, #04020a 100%);
      backdrop-filter: blur(20px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      overflow: hidden;
    }
    /* 首頁動態 Canvas 容器 */
    #home-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .home-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    /* 版本號右上角釘選 (融合 safe-area-inset) */
    .version-tag-corner {
      position: absolute;
      top: max(env(safe-area-inset-top, 14px), 14px);
      right: max(env(safe-area-inset-right, 18px), 18px);
      font-size: 11px;
      font-family: 'Orbitron', monospace;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 999px;
      padding: 4px 14px;
      letter-spacing: 1.5px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
      z-index: 3;
    }
    .home-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 34px;
      position: relative;
      z-index: 2;
    }
    /* 「AFTERIMAGE」純英文字標 - Syne 900 磅漸層立體光雕 */
    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 12px;
    }
    .game-logo-main {
      font-family: 'Syne', sans-serif;
      font-size: 58px;
      font-weight: 900;
      letter-spacing: 14px;
      padding-left: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 40%, #38bdf8 80%, #0284c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 32px rgba(56, 189, 248, 0.75));
      line-height: 1.1;
    }
    .game-subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      color: #c084fc;
      letter-spacing: 4px;
      font-weight: 700;
      opacity: 0.95;
      text-shadow: 0 0 14px rgba(168, 85, 247, 0.6);
      text-transform: uppercase;
    }
    .home-center {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    /* 幾何共振三芒星發光 Start 按鈕 */
    .btn-start {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      color: #04020a;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 4px;
      padding: 16px 60px;
      border-radius: 999px;
      border: 1.5px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 0 36px rgba(56, 189, 248, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      touch-action: manipulation;
      white-space: nowrap;
    }
    .btn-start:active {
      transform: scale(0.95);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
    }
    .home-link-btn {
      font-size: 12px;
      color: #cbd5e1;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .home-link-btn:active { background: rgba(255, 255, 255, 0.12); }

    .home-link-btn:active { background: rgba(255, 255, 255, 0.12); }

    /* 全局遊戲根容器 (100% 原生全螢幕滿版) */
    #game-root {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* 橫向引導提示遮罩 (直向時跳出旋轉提示) */
    .landscape-prompt {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: radial-gradient(circle at center, #0f172a, #070913);
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .landscape-prompt.active {
      display: flex;
    }
    .prompt-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      animation: rotatePhone 2s ease-in-out infinite alternate;
    }
    @keyframes rotatePhone {
      0% { transform: rotate(0deg); }
      30% { transform: rotate(0deg); }
      70% { transform: rotate(-90deg); }
      100% { transform: rotate(-90deg); }
    }
    .prompt-title {
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .prompt-desc {
      font-size: 13px;
      color: #94a3b8;
      max-width: 260px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <!-- 直向旋轉引導遮罩 -->
  <div id="landscape-prompt" class="landscape-prompt">
    <svg class="prompt-icon" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
      <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="3" />
    </svg>
    <div class="prompt-title">請將手機旋轉至橫向</div>
    <div class="prompt-desc">殘像需要雙手橫向操作以獲得最佳戰鬥視野與極致流暢度</div>
  </div>

  <div id="game-root">
    <canvas id="game-canvas"></canvas>

    <!-- 頂部 HUD -->
    <div class="hud">
      <div class="hud-left">
        <div class="bar-container">
          <span class="bar-label">HP</span>
          <div class="bar-track"><div id="hp-bar" class="bar-fill hp-fill"></div></div>
        </div>
        <div class="bar-container" id="exp-container">
          <span class="bar-label">LV.<span id="level-num">1</span></span>
          <div class="bar-track"><div id="exp-bar" class="bar-fill exp-fill" style="width: 0%;"></div></div>
        </div>
      </div>
      <!-- 1v1 對決專屬 AI 血條 -->
      <div class="duel-hud-center" id="duel-hud-center">
        <span style="font-size: 10px; font-weight: 900; color: #ec4899; font-family: 'Orbitron', monospace;">AI PHANTOM</span>
        <div class="bar-track" style="width: 140px; height: 8px;"><div id="ai-hp-bar" class="bar-fill ai-hp-fill" style="width: 100%;"></div></div>
        <span id="ai-charge-badge" style="font-size: 10px; font-weight: 900; color: #facc15; font-family: 'Orbitron', monospace;">CHG 2</span>
      </div>
      <div class="hud-right">
        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
          <div class="score-text" id="hud-score-label">KILLS <span id="kill-count">0</span></div>
          <button id="btn-fullscreen" title="全螢幕" style="background: none; border: none; font-size: 14px; color: #7dd3fc; cursor: pointer; padding: 2px 4px;">[ ]</button>
        </div>
        <div class="timer-text" id="time-display">00:00</div>
      </div>
    </div>

    <!-- 方案 A 控制層：左搖桿 + 右側人體工學扇形雙鍵 -->
    <div class="controls-layer">
      <div class="joystick-container">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>
      <div class="action-buttons">
        <button id="btn-swap" class="btn-action btn-swap disabled">
          <span class="btn-icon">SWAP</span>
          <span class="btn-lbl">換位</span>
        </button>
        <button id="btn-echo" class="btn-action btn-echo">
          <span id="echo-badge" class="btn-badge">2</span>
          <span class="btn-icon">REWIND</span>
          <span class="btn-lbl" id="echo-lbl">回溯</span>
        </button>
      </div>
    </div>

    <!-- 遊戲首頁 (Title Screen) - 幾何共振三芒星 -->
    <div id="home-screen" class="home-screen">
      <!-- 幾何光球與殘像連線動態 Canvas -->
      <canvas id="home-canvas"></canvas>

      <!-- 右上角極簡版本號標籤 -->
      <div class="version-tag-corner">RELEASE v0.0.15</div>

      <div class="home-header">

    function runNeuralNetwork(inputs, brain = AI_MODELS.chronoLord) {
      const hidden = new Array(brain.b1.length);
      for (let j = 0; j < brain.b1.length; j++) {
        let sum = brain.b1[j];
        for (let i = 0; i < inputs.length; i++) {
          sum += inputs[i] * brain.w1[i][j];
        }
        hidden[j] = Math.tanh(sum);
      }
      const outputs = new Array(brain.b2.length);
      for (let k = 0; k < brain.b2.length; k++) {
        let sum = brain.b2[k];
        for (let j = 0; j < hidden.length; j++) {
          sum += hidden[j] * brain.w2[j][k];
        }
        outputs[k] = Math.tanh(sum);
      }
      return outputs;
    }

    const promptModal = document.getElementById('landscape-prompt');

    function resize() {
      // 優先採用 visualViewport 或 documentElement 確保精確取得渲染寬高
      const vvW = window.visualViewport ? window.visualViewport.width : null;
      const vvH = window.visualViewport ? window.visualViewport.height : null;
      const iw = window.innerWidth;
      const ih = window.innerHeight;
      const cw = document.documentElement.clientWidth;
      const ch = document.documentElement.clientHeight;

      const winW = Math.floor(vvW || cw || iw);
      const winH = Math.floor(vvH || ch || ih);

      dbgLog(`📐 Resize: win=${winW}x${winH}, vv=${vvW}x${vvH}, inner=${iw}x${ih}`);

      // 手機直拿 (winW < winH) ➔ 顯示「請旋轉至橫向」引導遮罩
      if (winW < winH) {
        isPortraitMode = true;
        promptModal.classList.add('active');
        dbgLog(`📱 Mode: 直向模式 ➔ 顯示旋轉手機引導`);
      } else {
        // 手機橫拿 (winW >= winH) ➔ 隱藏引導，100% 原生全螢幕滿版
        isPortraitMode = false;
        promptModal.classList.remove('active');

        width = canvas.width = winW;
        height = canvas.height = winH;

        root.style.width = '100%';
        root.style.height = '100%';
        root.style.transform = 'none';

        dbgLog(`🎮 Mode: 原生橫向滿版, canvas=${width}x${height}`);

        player.x = width / 2;
        player.y = height / 2;
      }
    }

    window.addEventListener('resize', resize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resize);
      window.visualViewport.addEventListener('scroll', resize);
    }
    window.addEventListener('orientationchange', () => {
      setTimeout(resize, 50);
      setTimeout(resize, 150);
      setTimeout(resize, 350);
    });

    resize();
    requestAnimationFrame(resize);
    requestAnimationFrame(() => requestAnimationFrame(resize));
    setTimeout(resize, 60);
    setTimeout(resize, 200);
    setTimeout(resize, 500);
    window.addEventListener('load', () => {
      resize();
      setTimeout(resize, 100);
    });
    if (document.fonts && document.fonts.ready) {

    document.addEventListener('visibilitychange', () => {

        const osc = this.ctx.createOscillator();

    window.addEventListener('touchstart', e => {
      const isInteractive = e.target && (
        e.target.closest('button') || 
        e.target.closest('a') || 
        e.target.closest('#joystick-base') ||
        e.target.closest('.upgrade-card') ||
        e.target.closest('.btn-restart') ||
        e.target.tagName === 'INPUT' || 
        e.target.tagName === 'TEXTAREA'
      );
      if (!isInteractive && e.cancelable) {
        // 僅在非互動區域防止 Safari 長按放大鏡與手勢
        e.preventDefault();
      }
    }, { passive: false, capture: true });

    // --- 方案 A：左側固定搖桿控制 (嚴格使用 Touch 事件並主動 preventDefault 徹底封殺 iOS 放大鏡) ---
    const joyBase = document.getElementById('joystick-base');
    const joyStick = document.getElementById('joystick-stick');
    let joyTouchId = null;
    let joyOrigin = null;
    let joyVec = { x: 0, y: 0 };

    joyBase.addEventListener('touchstart', e => {
      e.preventDefault(); // 阻斷 iOS Safari 長按放大鏡與選取
      AudioEngine.init();
      const touch = e.changedTouches[0];
      joyTouchId = touch.identifier;
      const rect = joyBase.getBoundingClientRect();
      joyOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      handleJoyDrag(touch);
    }, { passive: false });

    joyBase.addEventListener('touchmove', e => {
      e.preventDefault(); // 阻斷滾動與長按
      if (joyOrigin) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === joyTouchId) {
            handleJoyDrag(e.changedTouches[i]);
            break;
          }
        }
      }
    }, { passive: false });

    function endJoyDrag(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          joyTouchId = null;
          joyOrigin = null;
          joyVec = { x: 0, y: 0 };
          joyStick.style.transform = 'translate(0px, 0px)';
          break;
        }
      }
    }
    joyBase.addEventListener('touchend', endJoyDrag, { passive: false });
    joyBase.addEventListener('touchcancel', endJoyDrag, { passive: false });

    // 電腦端滑鼠相容
    joyBase.addEventListener('mousedown', e => {
      e.preventDefault();
      AudioEngine.init();
      const rect = joyBase.getBoundingClientRect();
      joyOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      const onMouseMove = (me) => handleJoyDrag(me);
      const onMouseUp = () => {
        joyOrigin = null;
        joyVec = { x: 0, y: 0 };
        joyStick.style.transform = 'translate(0px, 0px)';
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
      };
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      handleJoyDrag(e);
    });

    function handleJoyDrag(pos) {
      const dx = pos.clientX - joyOrigin.x;
      const dy = pos.clientY - joyOrigin.y;

      const dist = Math.hypot(dx, dy);
      const maxR = 32;
      const angle = Math.atan2(dy, dx);
      const clamped = Math.min(dist, maxR);

      joyVec.x = (clamped / maxR) * Math.cos(angle);
      joyVec.y = (clamped / maxR) * Math.sin(angle);

      joyStick.style.transform = `translate(${Math.cos(angle) * clamped}px, ${Math.sin(angle) * clamped}px)`;
    }

    // 觸發回溯 (消耗 1 次充能，只要有充能即可無縫連放)
    function triggerEcho() {
      if (player.echoCharges <= 0 || player.history.length < 15) return;
      AudioEngine.playRewind();
      STATE.shake = 8;

      player.echoCharges--;
      if (player.echoChargeTimer <= 0) {
        player.echoChargeTimer = player.maxEchoChargeCd;
      }

      const oldState = player.history[0];
      const recordedActions = [...player.history];

      // 若場上殘像超過上限，頂替最早的殘像
      if (echoes.length >= player.maxEchoCount) {
        echoes.shift();
      }

      // 殘像機制：播放完整過去 3 秒軌跡 1 次，走到終點後停在原地 3 秒才消失
      echoes.push({
        frames: recordedActions,
        currentFrame: 0,
        x: player.x,
        y: player.y,
        isFinished: false,
        standTimer: 180, // 走完後原地駐留 3 秒 (180 幀)
        shootCd: 0
      });

      player.x = oldState.x;
      player.y = oldState.y;
      player.invulnerable = 35;
      // 以著陸點填滿歷史軌跡，使 3 秒前預覽虛影能即時平滑跟隨移動，不被鎖定在原地
      player.history = Array.from({ length: player.maxHistory }, () => ({
        x: player.x,
        y: player.y,
        shooting: false
      }));

      // 時空回溯共振：引爆場上所有正在飛行的貫穿能量球 (SUPER NOVA)

        energyOrbs.length = 0; // 清空能量球
      }

      for (let i = 0; i < 16; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 3;
        particles.push({
          x: player.x, y: player.y,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          life: 20, color: '#38bdf8', size: 2
        });
      }
    }

    // 觸發換位
    function triggerSwap() {
      if (echoes.length === 0) return;
      AudioEngine.playSwap();
      STATE.shake = 6;

      // 與最新或唯一的殘像換位
      const targetEcho = echoes[echoes.length - 1];
      const px = player.x;
      const py = player.y;

      player.x = targetEcho.x;
      player.y = targetEcho.y;
      targetEcho.x = px;
      targetEcho.y = py;

      // 基礎換位 20 幀無敵，若解鎖「相位虛化」則提升至 60 幀 (1秒) 並賦予極速移動
      if (player.phaseShift > 0) {
        player.invulnerable = 60;

        popups.push({ x: player.x, y: player.y - 14, text: 'PHASE SHIFT', life: 25, color: '#38bdf8' });
      } else {
        player.invulnerable = 20;
      }

      // 天賦一：量子穿梭居合斬 (Phantom Slash)
      if (player.phantomSlash > 0) {
        AudioEngine.playSlash();
        STATE.shake = 12;
        const slashDmg = 90 * player.phantomSlash;
        let slashedCount = 0;

        for (const e of enemies) {
          // 判定怪物是否處於本體與殘像瞬移路徑 (px, py) -> (player.x, player.y) 兩側 28px 內
          if (pointToSegmentDist(e.x, e.y, px, py, player.x, player.y) < e.radius + 28) {
            e.hp -= slashDmg;
            e.flash = 5;
            slashedCount++;
            popups.push({ x: e.x, y: e.y - 12, text: `SLASH ${slashDmg}`, life: 30, color: '#facc15' });

            // 怪物受擊擊退
            const angle = Math.atan2(e.y - py, e.x - px);
            e.x += Math.cos(angle) * 16;
            e.y += Math.sin(angle) * 16;
          }
        }

        // 金色居合裂空光塵粒子
        for (let i = 0; i < 28; i++) {
          const t = Math.random();
          const perpAng = Math.atan2(player.y - py, player.x - px) + (Math.PI / 2);
          const offset = (Math.random() - 0.5) * 24;
          particles.push({
            x: px + (player.x - px) * t + Math.cos(perpAng) * offset,
            y: py + (player.y - py) * t + Math.sin(perpAng) * offset,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,

            vy: (Math.random() - 0.5) * 2,

        }
      }
    }
