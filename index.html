          if (e) {
            e.preventDefault();
            e.stopPropagation();
          }
          AudioEngine.init();
          item.apply();
          modal.classList.remove('active');
          STATE.isPaused = false;
        };
        card.addEventListener('pointerdown', selectCard);
        list.appendChild(card);
      });
      modal.classList.add('active');
    }

    // --- 遊戲主循環 ---
    let frameCount = 0;
    function update() {
      if (!STATE.isStarted || STATE.isPaused || STATE.isGameOver) return;
      frameCount++;
      STATE.gameTime++;

      // 無敵受傷幀遞減
      if (player.invulnerable > 0) {
        player.invulnerable--;
      }

      // 相位虛化極速加成計時器與死境回溯冷卻
      if (player.speedBuffTimer > 0) player.speedBuffTimer--;
      if (player.deathDefianceCd > 0) player.deathDefianceCd--;

      const currentSpeed = player.speedBuffTimer > 0 ? player.speed * 1.4 : player.speed;

      // 1. 移動計算 (放手時即原地停下)
      let moveX = 0, moveY = 0;
      if (keys['w'] || keys['arrowup']) moveY -= 1;
      if (keys['s'] || keys['arrowdown']) moveY += 1;
      if (keys['a'] || keys['arrowleft']) moveX -= 1;
      if (keys['d'] || keys['arrowright']) moveX += 1;

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        moveX = (moveX / len) * currentSpeed;
        moveY = (moveY / len) * currentSpeed;
        player.facingAngle = Math.atan2(moveY, moveX); // 更新前進朝向
      } else if (joyOrigin && (joyVec.x !== 0 || joyVec.y !== 0)) {
        moveX = joyVec.x * currentSpeed;
        moveY = joyVec.y * currentSpeed;
        player.facingAngle = Math.atan2(moveY, moveX); // 更新前進朝向
      }

      player.x = Math.max(player.radius, Math.min(width - player.radius, player.x + moveX));
      player.y = Math.max(player.radius, Math.min(height - player.radius, player.y + moveY));

      // 紀錄歷史
      player.history.push({ x: player.x, y: player.y, shooting: player.attackCd <= 0 });
      if (player.history.length > player.maxHistory) {
        player.history.shift();
      }

      // 回溯充能恢復邏輯 (低於最大充能時自動倒數充能)
      if (player.echoCharges < player.maxEchoCharges) {
        player.echoChargeTimer--;
        if (player.echoChargeTimer <= 0) {
          player.echoCharges++;
          if (player.echoCharges < player.maxEchoCharges) {
            player.echoChargeTimer = player.maxEchoChargeCd;
          }
        }
      }

      // 2. 主武器發射：固定精確朝向 player.facingAngle 前方開路
      player.attackCd--;
      if (player.attackCd <= 0) {
        const spread = 0.14;
        const startOffset = -(player.mainCount - 1) * spread / 2;
        for (let i = 0; i < player.mainCount; i++) {
          const ang = player.facingAngle + startOffset + i * spread;
          bullets.push({
            x: player.x, y: player.y,
            vx: Math.cos(ang) * 10.0, vy: Math.sin(ang) * 10.0,
            damage: player.mainDmg,
            life: 55,
            isEcho: false,
            isSub: false // 主武器開路子彈
          });
        }
        AudioEngine.playLaser();
        player.attackCd = player.attackSpeed;
      }

      // 2.5 副武器發射：自動尋標量子飛彈 (若 subCount > 0 且場上有敵人)
      if (player.subCount > 0) {
        player.subAttackCd--;
        if (player.subAttackCd <= 0 && enemies.length > 0) {
          // 尋找最近的敵人作為初始導引目標
          let nearest = null, minDist = Infinity;
          for (const e of enemies) {
            const d = Math.hypot(e.x - player.x, e.y - player.y);
            if (d < minDist) { minDist = d; nearest = e; }
          }
          if (nearest) {
            const baseAng = Math.atan2(nearest.y - player.y, nearest.x - player.x);
            for (let i = 0; i < player.subCount; i++) {
              const angOffset = (i - (player.subCount - 1) / 2) * 0.35;
              const launchAng = baseAng + angOffset;
              bullets.push({
                x: player.x, y: player.y,
                vx: Math.cos(launchAng) * 7.5, vy: Math.sin(launchAng) * 7.5,
                damage: player.subDmg,
                life: 70,
                isEcho: false,
                isSub: true, // 副武器追蹤飛彈
                target: nearest,
                turnSpeed: 0.12 // 飛彈主動轉向角速度
              });
            }
          }
          player.subAttackCd = player.subAttackSpeed;
        }
      }

      // 3. 殘像更新 (回放 1 次 ➔ 原地停留 3 秒持續攻擊 ➔ 粒子消散)
      for (let i = echoes.length - 1; i >= 0; i--) {
        const ec = echoes[i];
        ec.shootCd--;

        if (!ec.isFinished) {
          // 階段一：正在回放歷史軌跡 (只播 1 次)
          if (ec.currentFrame < ec.frames.length) {
            const record = ec.frames[ec.currentFrame];
            ec.x = record.x;
            ec.y = record.y;
            ec.currentFrame++;

            // 殘像具備獨立攻擊節奏：每 18 幀自動向最近敵人開火
            if (ec.shootCd <= 0 && enemies.length > 0) {
              let nearest = null, minDist = Infinity;
              for (const e of enemies) {
                const d = Math.hypot(e.x - ec.x, e.y - ec.y);
                if (d < minDist) { minDist = d; nearest = e; }
              }
              if (nearest) {
                const ang = Math.atan2(nearest.y - ec.y, nearest.x - ec.x);
                bullets.push({
                  x: ec.x, y: ec.y,
                  vx: Math.cos(ang) * 7.5, vy: Math.sin(ang) * 7.5,
                  damage: 14, life: 50, isEcho: true, isSub: false
                });
                ec.shootCd = 18; // 殘像獨立攻擊間隔
              }
            }
          } else {
            // 軌跡播放完畢，進入原地停留 3 秒階段
            ec.isFinished = true;
          }
        } else {
          // 階段二：留在結束點原地駐留 3 秒 (180 幀)，持續向最近敵人鎖定射擊
          ec.standTimer--;
          if (ec.shootCd <= 0 && enemies.length > 0) {
            let nearest = null, minDist = Infinity;
            for (const e of enemies) {
              const d = Math.hypot(e.x - ec.x, e.y - ec.y);
              if (d < minDist) { minDist = d; nearest = e; }
            }
            if (nearest) {
              const ang = Math.atan2(nearest.y - ec.y, nearest.x - ec.x);
              bullets.push({
                x: ec.x, y: ec.y,
                vx: Math.cos(ang) * 7.5, vy: Math.sin(ang) * 7.5,
                damage: 14, life: 50, isEcho: true, isSub: false
              });
              ec.shootCd = 18; // 原地砲台射速
            }
          }

          if (ec.standTimer <= 0) {
            for (let p = 0; p < 14; p++) {
              const ang = Math.random() * Math.PI * 2;
              particles.push({
                x: ec.x, y: ec.y,
                vx: Math.cos(ang) * 3, vy: Math.sin(ang) * 3,
                life: 20, color: '#a855f7', size: 2
              });
            }
            echoes.splice(i, 1);
          }
        }
      }

      // 殘像雷射割裂與結界判定 (透過 Convex Hull 自動構建向外凸起的包絡多邊形，絕不凹陷或自交)
      if (echoes.length === 1) {
        const ec = echoes[0];
        for (const enemy of enemies) {
          if (pointToSegmentDist(enemy.x, enemy.y, player.x, player.y, ec.x, ec.y) < enemy.radius + 4) {
            enemy.hp -= player.resonanceDmg;
            enemy.flash = 2;
          }
        }
      } else if (echoes.length >= 2) {
        const allPoints = [{ x: player.x, y: player.y }, ...echoes.map(e => ({ x: e.x, y: e.y }))];
        const hull = getConvexHull(allPoints);

        for (const enemy of enemies) {
          // 判定一：怪物位於凸包多邊形內部
          let isHit = isPointInPolygon({ x: enemy.x, y: enemy.y }, hull);

          // 判定二：怪物碰觸到凸包雷射連線邊界
          if (!isHit) {
            for (let j = 0; j < hull.length; j++) {
              const p1 = hull[j];
              const p2 = hull[(j + 1) % hull.length];
              if (pointToSegmentDist(enemy.x, enemy.y, p1.x, p1.y, p2.x, p2.y) < enemy.radius + 4) {
                isHit = true;
                break;
              }
            }
          }

          if (isHit) {
            enemy.hp -= player.resonanceDmg * 1.5;
            enemy.flash = 2;
            if (Math.random() < 0.2) {
              particles.push({
                x: enemy.x, y: enemy.y,
                vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
                life: 10, color: '#facc15', size: 1.8
              });
            }
          }
        }
      }

      // 軌道光刃 (縮小環繞半徑至 40px)
      if (player.orbitalBlade > 0) {
        player.bladeAngle += 0.05;
        const bladeDist = 40;
        for (let b = 0; b < player.orbitalBlade; b++) {
          const ang = player.bladeAngle + (b * (Math.PI * 2 / player.orbitalBlade));
          const bx = player.x + Math.cos(ang) * bladeDist;
          const by = player.y + Math.sin(ang) * bladeDist;
          for (const e of enemies) {
            if (Math.hypot(e.x - bx, e.y - by) < e.radius + 7) {
              e.hp -= 1.2;
              e.flash = 2;
            }
          }
        }
      }

      // 4. 自動發射貫穿時空能量球 (固定朝前進朝向發射，衝刺追擊撞擊引爆超新星)
      player.orbCd--;
      if (player.orbCd <= 0) {
        const ang = player.facingAngle;
        energyOrbs.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(ang) * 4.2,
          vy: Math.sin(ang) * 4.2,
          radius: 12,
          damage: 24,
          life: 240, // 存活 4 秒
          armDelay: 18 // 發射 18 幀後解鎖與本體碰撞（方便前進追擊撞爆）
        });
        AudioEngine.playOrbLaunch();
        player.orbCd = player.maxOrbCd;
      }

      // 更新貫穿能量球
      for (let i = energyOrbs.length - 1; i >= 0; i--) {
        const orb = energyOrbs[i];
        orb.x += orb.vx;
        orb.y += orb.vy;
        orb.life--;
        if (orb.armDelay > 0) orb.armDelay--;

        // 能量球粒子尾跡
        if (frameCount % 2 === 0) {
          particles.push({
            x: orb.x + (Math.random() - 0.5) * 8,
            y: orb.y + (Math.random() - 0.5) * 8,
            vx: -orb.vx * 0.2,
            vy: -orb.vy * 0.2,
            life: 14,
            color: '#38bdf8',
            size: 2.5
          });
        }

        // 穿透所有敵人造成傷害
        for (const e of enemies) {
          if (Math.hypot(e.x - orb.x, e.y - orb.y) < e.radius + orb.radius) {
            // 計算攻擊角度與 Boss 護盾
            let blocked = false;
            if (e.isBoss && e.hasShield) {
              const hitAngle = Math.atan2(orb.y - e.y, orb.x - e.x);
              const angleDiff = Math.abs(normalizeAngle(hitAngle - e.facingAngle));
              if (angleDiff < Math.PI * 0.45) {
                blocked = true; // 正面 160 度扇形護盾阻擋
                AudioEngine.playShieldBlock();
                popups.push({ x: e.x, y: e.y - 14, text: 'BLOCKED', life: 18, color: '#38bdf8' });
              }
            }
            if (!blocked) {
              e.hp -= orb.damage * 0.3; // 穿透時每幀造成高頻切割傷害
              e.flash = 2;
            }
          }
        }

        // 核心機制：能量球若碰到了「自己的本體」-> 引爆大範圍時空湮滅！
        if (orb.armDelay <= 0 && Math.hypot(player.x - orb.x, player.y - orb.y) < player.radius + orb.radius) {
          triggerOrbSuperExplosion(orb.x, orb.y);
          energyOrbs.splice(i, 1);
          continue;
        }

        // 穿透飛出螢幕邊界外直接自然消逝（不反彈）
        const isOutOfScreen = orb.x < -50 || orb.x > width + 50 || orb.y < -50 || orb.y > height + 50;
        if (orb.life <= 0 || isOutOfScreen) {
          energyOrbs.splice(i, 1);
        }
      }

      // 5. 子彈更新 (含主武器高速穿甲、副武器主動追蹤飛彈與 Boss 護盾判定)
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];

        // 副武器飛彈主動尋標轉向
        if (b.isSub) {
          // 若目標死亡或不存在，動態重新搜尋最近目標
          if (!b.target || b.target.hp <= 0 || !enemies.includes(b.target)) {
            let nearest = null, minDist = Infinity;
            for (const e of enemies) {
              const d = Math.hypot(e.x - b.x, e.y - b.y);
              if (d < minDist) { minDist = d; nearest = e; }
            }
            b.target = nearest;
          }

          if (b.target) {
            const targetAngle = Math.atan2(b.target.y - b.y, b.target.x - b.x);
            const currentAngle = Math.atan2(b.vy, b.vx);
            const diff = normalizeAngle(targetAngle - currentAngle);
            const newAngle = currentAngle + Math.sign(diff) * Math.min(Math.abs(diff), b.turnSpeed || 0.12);
            const spd = Math.hypot(b.vx, b.vy);
            b.vx = Math.cos(newAngle) * spd;
            b.vy = Math.sin(newAngle) * spd;
          }

          // 副武器粉色尾跡微粒
          if (frameCount % 2 === 0) {
            particles.push({
              x: b.x, y: b.y,
              vx: (Math.random() - 0.5) * 1.5,
              vy: (Math.random() - 0.5) * 1.5,
              life: 10,
              color: '#ec4899',
              size: 1.8
            });
          }
        }

        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        for (const e of enemies) {
          const hitRadius = b.isSub ? e.radius + 6 : e.radius + 3;
          if (Math.hypot(e.x - b.x, e.y - b.y) < hitRadius) {
            let blocked = false;
            if (e.isBoss && e.hasShield) {
              const hitAngle = Math.atan2(b.y - e.y, b.x - e.x);
              const angleDiff = Math.abs(normalizeAngle(hitAngle - e.facingAngle));
              // 正面 160 度範圍被護盾完全吸收
              if (angleDiff < Math.PI * 0.45) {
                blocked = true;
                AudioEngine.playShieldBlock();
                popups.push({ x: e.x, y: e.y - 12, text: 'GUARD', life: 16, color: '#38bdf8' });
                // 護盾火花
                for (let p = 0; p < 4; p++) {
                  particles.push({
                    x: b.x, y: b.y,
                    vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
                    life: 10, color: '#38bdf8', size: 2
                  });
                }
              }
            }

            if (!blocked) {
              e.hp -= b.damage;
              e.flash = 3;
              AudioEngine.playHit();
              const popupColor = b.isSub ? '#ec4899' : (b.isEcho ? '#a855f7' : '#38bdf8');
              popups.push({ x: e.x, y: e.y - 8, text: b.damage, life: 20, color: popupColor });
            }
            b.life = 0;
            break;
          }
        }
        if (b.life <= 0) bullets.splice(i, 1);
      }

      // 6. 模式邏輯分支：經典生存怪群 VS 1v1 鏡像對決 AI
      if (STATE.gameMode === 'duel' && phantomAI) {
        // --- 1V1 PHANTOM AI 神經網絡大腦每幀決策 ---
        if (phantomAI.invulnerable > 0) phantomAI.invulnerable--;

        // AI 充能恢復
        if (phantomAI.echoCharges < phantomAI.maxEchoCharges) {
          phantomAI.echoChargeTimer--;
          if (phantomAI.echoChargeTimer <= 0) {
            phantomAI.echoCharges++;
            if (phantomAI.echoCharges < phantomAI.maxEchoCharges) phantomAI.echoChargeTimer = phantomAI.maxEchoChargeCd;
          }
        }

        // 構造神經網絡輸入特徵 (8維)
        const dx = (player.x - phantomAI.x) / width;
        const dy = (player.y - phantomAI.y) / height;
        const dist = Math.hypot(player.x - phantomAI.x, player.y - phantomAI.y) / 1000;
        let pLaserDist = 1.0;
        if (echoes.length > 0) {
          pLaserDist = pointToSegmentDist(phantomAI.x, phantomAI.y, player.x, player.y, echoes[0].x, echoes[0].y) / 500;
        }
        const aiInputs = [
          dx, dy, dist,
          Math.cos(phantomAI.facingAngle - player.facingAngle),
          echoes.length / 2,
          pLaserDist,
          phantomAI.echoCharges / 2,
          phantomAI.hp / phantomAI.maxHp
        ];

        // 執行當前所選難度之模型前向推論 (Forward Inference)
        const selectedBrain = AI_MODELS[currentAIDifficulty] || AI_MODELS.chronoLord;
        const aiOut = runNeuralNetwork(aiInputs, selectedBrain);
        // aiOut[0]: moveX, aiOut[1]: moveY, aiOut[2]: triggerEcho (>0.6), aiOut[3]: triggerSwap (>0.6)

        const mLen = Math.hypot(aiOut[0], aiOut[1]);
        if (mLen > 0.15) {
          phantomAI.x += (aiOut[0] / mLen) * phantomAI.speed;
          phantomAI.y += (aiOut[1] / mLen) * phantomAI.speed;
          phantomAI.facingAngle = Math.atan2(aiOut[1], aiOut[0]);
        }
        phantomAI.x = Math.max(phantomAI.radius, Math.min(width - phantomAI.radius, phantomAI.x));
        phantomAI.y = Math.max(phantomAI.radius, Math.min(height - phantomAI.radius, phantomAI.y));

        phantomAI.history.push({ x: phantomAI.x, y: phantomAI.y });
        if (phantomAI.history.length > phantomAI.maxHistory) phantomAI.history.shift();

        // AI 發動回溯 (Rewind)
        if (aiOut[2] > 0.65 && phantomAI.echoCharges > 0 && phantomAI.history.length >= 15) {
          phantomAI.echoCharges--;
          if (phantomAI.echoChargeTimer <= 0) phantomAI.echoChargeTimer = phantomAI.maxEchoChargeCd;
          const oldState = phantomAI.history[0];
          phantomAI.echoes.push({
            frames: [...phantomAI.history],
            currentFrame: 0,
            x: phantomAI.x,
            y: phantomAI.y,
            lifeTimer: 360,
            shootCd: 0
          });
          phantomAI.x = oldState.x;
          phantomAI.y = oldState.y;
          phantomAI.invulnerable = 35;
          phantomAI.history = Array.from({ length: phantomAI.maxHistory }, () => ({ x: phantomAI.x, y: phantomAI.y }));
          popups.push({ x: phantomAI.x, y: phantomAI.y - 15, text: 'AI REWIND', life: 25, color: '#ec4899' });
          AudioEngine.playRewind();
        }

        // AI 發動換位 (Swap)
        if (aiOut[3] > 0.65 && phantomAI.echoes.length > 0) {
          const targetEcho = phantomAI.echoes[phantomAI.echoes.length - 1];
          const px = phantomAI.x;
          const py = phantomAI.y;
          phantomAI.x = targetEcho.x;
          phantomAI.y = targetEcho.y;
          targetEcho.x = px;
          targetEcho.y = py;
          phantomAI.invulnerable = 20;
          popups.push({ x: phantomAI.x, y: phantomAI.y - 15, text: 'AI SWAP', life: 25, color: '#facc15' });
          AudioEngine.playSwap();
        }

        // AI 前向開路砲開火 (紅色光錐)
        phantomAI.attackCd--;
        if (phantomAI.attackCd <= 0) {
          bullets.push({
            x: phantomAI.x, y: phantomAI.y,
            vx: Math.cos(phantomAI.facingAngle) * 9.5, vy: Math.sin(phantomAI.facingAngle) * 9.5,
            damage: 18, life: 55, isEcho: false, isSub: false, isAI: true
          });
          AudioEngine.playLaser();
          phantomAI.attackCd = phantomAI.attackSpeed;
        }

        // AI 殘像生命週期與雷射連線
        for (let k = phantomAI.echoes.length - 1; k >= 0; k--) {
          const aie = phantomAI.echoes[k];
          aie.lifeTimer--;
          if (aie.currentFrame < aie.frames.length) {
            const r = aie.frames[aie.currentFrame];
            aie.x = r.x; aie.y = r.y;
            aie.currentFrame++;
          }
          if (aie.lifeTimer <= 0) phantomAI.echoes.splice(k, 1);
        }

        // AI 紅色時空雷射連線割裂玩家
        if (phantomAI.echoes.length > 0) {
          const aie = phantomAI.echoes[0];
          if (pointToSegmentDist(player.x, player.y, phantomAI.x, phantomAI.y, aie.x, aie.y) < player.radius + 4) {
            if (player.invulnerable <= 0) {
              player.hp -= phantomAI.resonanceDmg;
              player.invulnerable = 4;
              STATE.shake = 3;
            }
          }
        }

        // 判定玩家子彈命中 AI
        for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
          const b = bullets[bIdx];
          if (!b.isAI && Math.hypot(phantomAI.x - b.x, phantomAI.y - b.y) < phantomAI.radius + 4) {
            if (phantomAI.invulnerable <= 0) {
              phantomAI.hp -= b.damage;
              AudioEngine.playHit();
              popups.push({ x: phantomAI.x, y: phantomAI.y - 10, text: b.damage, life: 20, color: '#38bdf8' });
              if (phantomAI.hp <= 0) {
                phantomAI.hp = 0;
                gameOver(true); // 玩家獲勝！
              }
            }
            bullets.splice(bIdx, 1);
          }
        }

        // 判定 AI 子彈命中玩家
        for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
          const b = bullets[bIdx];
          if (b.isAI && Math.hypot(player.x - b.x, player.y - b.y) < player.radius + 4) {
            if (player.invulnerable <= 0) {
              player.hp -= b.damage;
              player.invulnerable = 25;
              STATE.shake = 8;
              AudioEngine.playHit();
              popups.push({ x: player.x, y: player.y - 12, text: b.damage, life: 25, color: '#ef4444' });
              if (player.hp <= 0) {
                player.hp = 0;
                gameOver(false); // 玩家戰敗
              }
            }
            bullets.splice(bIdx, 1);
          }
        }

        // 更新 AI HUD
        const aiHpBar = document.getElementById('ai-hp-bar');
        const aiBadge = document.getElementById('ai-charge-badge');
        if (aiHpBar) aiHpBar.style.width = `${(phantomAI.hp / phantomAI.maxHp) * 100}%`;
        if (aiBadge) aiBadge.innerText = `CHG ${phantomAI.echoCharges}`;

      } else {
        // --- 經典生存怪群生成 ---
        const isBossTime = STATE.gameTime > 0 && STATE.gameTime % 2700 === 0;
        if (isBossTime) {
          spawnBoss();
        }

        const spawnInterval = Math.max(18, 60 - Math.floor(STATE.gameTime / 300));
        if (frameCount % spawnInterval === 0) {
          const edge = Math.floor(Math.random() * 4);
          let ex = 0, ey = 0;
          if (edge === 0) { ex = Math.random() * width; ey = -40; }
          else if (edge === 1) { ex = width + 40; ey = Math.random() * height; }
          else if (edge === 2) { ex = Math.random() * width; ey = height + 40; }
          else { ex = -40; ey = Math.random() * height; }

          enemies.push({
            x: ex, y: ey,
            radius: 8,
            speed: 1.1 + Math.random() * 0.7,
            hp: 22 + Math.floor(STATE.gameTime / 400) * 8,
            maxHp: 22 + Math.floor(STATE.gameTime / 400) * 8,
            flash: 0,
            isBoss: false
          });
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.flash > 0) e.flash--;

        let target = player;
        if (echoes.length > 0 && i % 2 === 0) {
          target = echoes[0];
        }

        if (e.isBoss) {
          // Boss 專屬狀態機 (追擊 -> 蓄力預警 -> 超速直線衝鋒 -> 短暫硬直)
          e.stateTimer--;

          if (e.state === 'chase') {
            const targetAng = Math.atan2(target.y - e.y, target.x - e.x);
            // 平滑轉向（加入角速度限制，防止瞬間調頭護盾始終擋住玩家）
            let angleDiff = normalizeAngle(targetAng - e.facingAngle);
            e.facingAngle += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), e.turnRate);

            e.x += Math.cos(e.facingAngle) * e.speed;
            e.y += Math.sin(e.facingAngle) * e.speed;

            if (e.stateTimer <= 0) {
              // 進入蓄力狀態
              e.state = 'windup';
              e.stateTimer = 45; // 蓄力 0.75 秒
              e.dashAngle = Math.atan2(player.y - e.y, player.x - e.x);
              e.facingAngle = e.dashAngle;
              popups.push({ x: e.x, y: e.y - 30, text: 'CHARGE LOCK', life: 30, color: '#facc15' });
            }
          } else if (e.state === 'windup') {
            // 蓄力微震與聚能粒子
            if (frameCount % 3 === 0) {
              particles.push({
                x: e.x + (Math.random() - 0.5) * 30,
                y: e.y + (Math.random() - 0.5) * 30,
                vx: -Math.cos(e.dashAngle) * 3,
                vy: -Math.sin(e.dashAngle) * 3,
                life: 12,
                color: '#facc15',
                size: 2.5
              });
            }
            if (e.stateTimer <= 0) {
              // 發動超速大直線衝撞
              e.state = 'dash';
              e.stateTimer = 40; // 衝刺 40 幀 (移動超過 220px，必定衝過玩家身後！)
              STATE.shake = 10;
              AudioEngine.playOrbLaunch();
            }
          } else if (e.state === 'dash') {
            // 直線高速衝刺，不追蹤
            e.x += Math.cos(e.dashAngle) * e.dashSpeed;
            e.y += Math.sin(e.dashAngle) * e.dashSpeed;

            // 衝刺尾跡火花
            particles.push({
              x: e.x - Math.cos(e.dashAngle) * e.radius,
              y: e.y - Math.sin(e.dashAngle) * e.radius,
              vx: (Math.random() - 0.5) * 2,
              vy: (Math.random() - 0.5) * 2,
              life: 16,
              color: '#f43f5e',
              size: 3
            });

            if (e.stateTimer <= 0) {
              e.state = 'cooldown';
              e.stateTimer = 60; // 衝完後短暫冷卻 1 秒，給玩家充足時間背刺！
            }
          } else if (e.state === 'cooldown') {
            // 冷卻減速緩行
            e.x += Math.cos(e.dashAngle) * 0.4;
            e.y += Math.sin(e.dashAngle) * 0.4;
            if (e.stateTimer <= 0) {
              e.state = 'chase';
              e.stateTimer = 180; // 3 秒後準備下一輪衝刺
            }
          }

          // 邊界防出界
          e.x = Math.max(e.radius, Math.min(width - e.radius, e.x));
          e.y = Math.max(e.radius, Math.min(height - e.radius, e.y));
        } else {
          // 普通怪物追擊
          const angle = Math.atan2(target.y - e.y, target.x - e.x);
          e.facingAngle = angle;
          e.x += Math.cos(angle) * e.speed;
          e.y += Math.sin(angle) * e.speed;
        }

        if (Math.hypot(e.x - player.x, e.y - player.y) < e.radius + player.radius) {
          if (player.invulnerable <= 0) {
            const dmg = e.isBoss ? 28 : 12;
            player.hp -= dmg;
            player.invulnerable = 30; // 0.5 秒無敵受擊保護
            STATE.shake = e.isBoss ? 12 : 6;
            AudioEngine.playHit();
            popups.push({ x: player.x, y: player.y - 14, text: dmg, life: 25, color: '#ef4444' });

            // 玩家受傷紅色粒子
            for (let p = 0; p < 6; p++) {
              const ang = Math.random() * Math.PI * 2;
              particles.push({
                x: player.x, y: player.y,
                vx: Math.cos(ang) * 2.5, vy: Math.sin(ang) * 2.5,
                life: 14, color: '#ef4444', size: 2.5
              });
            }

            if (player.hp <= 0) {
              // 判定天賦：極限死境回溯 (Death Defiance)
              if (player.deathDefiance > 0 && player.deathDefianceCd <= 0) {
                AudioEngine.playDeathDefied();
                STATE.shake = 18;
                player.hp = 50; // 強制回溯並拉回 50 點生命值
                player.deathDefianceCd = 3600; // 60 秒 CD
                player.invulnerable = 60; // 1 秒絕對無敵保護

                popups.push({ x: player.x, y: player.y - 20, text: 'DEATH DEFIED!', life: 45, color: '#facc15' });

                // 強制觸發一次時空回溯（若充能 > 0 扣 1，若充能為 0 則免費贈送回溯逃生）
                if (player.echoCharges > 0) player.echoCharges--;
                const oldState = player.history[0] || { x: width / 2, y: height / 2 };
                player.x = oldState.x;
                player.y = oldState.y;

                // 震退周圍 120px 內的所有怪物
                for (const em of enemies) {
                  const dist = Math.hypot(em.x - player.x, em.y - player.y);
                  if (dist < 120) {
                    const pushAng = Math.atan2(em.y - player.y, em.x - player.x);
                    em.x += Math.cos(pushAng) * 45;
                    em.y += Math.sin(pushAng) * 45;
                  }
                }
              } else {
                player.hp = 0;
                gameOver();
              }
            }
          }
        }

        if (e.hp <= 0) {
          STATE.kills++;
          if (e.isBoss) {
            // Boss 死亡掉落大量經驗晶體與劇烈震動
            STATE.shake = 16;
            for (let g = 0; g < 12; g++) {
              gems.push({ x: e.x + (Math.random() - 0.5) * 40, y: e.y + (Math.random() - 0.5) * 40, exp: 5 });
            }
            popups.push({ x: e.x, y: e.y - 20, text: 'BOSS DEFEATED', life: 40, color: '#facc15' });
          } else {
            gems.push({ x: e.x, y: e.y, exp: 2 });
          }

          for (let p = 0; p < (e.isBoss ? 24 : 6); p++) {
            const ang = Math.random() * Math.PI * 2;
            particles.push({
              x: e.x, y: e.y,
              vx: Math.cos(ang) * (e.isBoss ? 5 : 2.5),
              vy: Math.sin(ang) * (e.isBoss ? 5 : 2.5),
              life: e.isBoss ? 30 : 16,
              color: e.isBoss ? '#facc15' : '#f43f5e',
              size: e.isBoss ? 3 : 1.8
            });
          }
          enemies.splice(i, 1);
        }
      }

      // 6. 經驗晶體
      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const dist = Math.hypot(player.x - g.x, player.y - g.y);
        if (dist < 100) {
          const ang = Math.atan2(player.y - g.y, player.x - g.x);
          g.x += Math.cos(ang) * 5.5;
          g.y += Math.sin(ang) * 5.5;
        }
        if (dist < player.radius + 6) {
          STATE.exp += g.exp;
          AudioEngine.playGem();
          if (STATE.exp >= STATE.maxExp) {
            STATE.level++;
            STATE.exp -= STATE.maxExp;
            STATE.maxExp = Math.floor(STATE.maxExp * 1.35);
            showUpgradeModal();
          }
          gems.splice(i, 1);
        }
      }

      // 7. 粒子與飄字
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) {
        const pu = popups[i];
        pu.y -= 0.6;
        pu.life--;
        if (pu.life <= 0) popups.splice(i, 1);
      }

      // 8. 更新 DOM UI 與按鈕冷卻狀態
      document.getElementById('hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
      document.getElementById('exp-bar').style.width = `${(STATE.exp / STATE.maxExp) * 100}%`;
      document.getElementById('level-num').innerText = STATE.level;
      document.getElementById('kill-count').innerText = STATE.kills;

      const sec = Math.floor(STATE.gameTime / 60);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      document.getElementById('time-display').innerText = `${mm}:${ss}`;

      // 按鈕狀態反饋 (文字保持「回溯」，次數以右上角角標「1」「2」呈現)
      const echoLbl = document.getElementById('echo-lbl');
      const echoBadge = document.getElementById('echo-badge');
      if (player.echoCharges <= 0) {
        btnEcho.classList.add('disabled');
        echoLbl.innerText = `${(player.echoChargeTimer / 60).toFixed(1)}s`;
        if (echoBadge) echoBadge.style.display = 'none';
      } else {
        btnEcho.classList.remove('disabled');
        echoLbl.innerText = '回溯';
        if (echoBadge) {
          echoBadge.style.display = 'flex';
          echoBadge.innerText = player.echoCharges;
        }
      }

      if (echoes.length > 0) {
        btnSwap.classList.remove('disabled');
      } else {
        btnSwap.classList.add('disabled');
      }
    }

    // 幾何工具與數值計算
    function normalizeAngle(ang) {
      while (ang > Math.PI) ang -= Math.PI * 2;
      while (ang < -Math.PI) ang += Math.PI * 2;
      return ang;
    }

    function pointToSegmentDist(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    // 凸包算法 (Andrew's Monotone Chain Convex Hull Algorithm)
    // 確保多個殘像與本體之間的連線永遠是向外凸起的結界，絕不凹陷或自交交叉
    function getConvexHull(points) {
      if (points.length <= 2) return points;
      const sorted = [...points].sort((a, b) => a.x === b.x ? a.y - b.y : a.x - b.x);

      const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);

      // 下凸包
      const lower = [];
      for (const p of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) {
          lower.pop();
        }
        lower.push(p);
      }

      // 上凸包
      const upper = [];
      for (let i = sorted.length - 1; i >= 0; i--) {
        const p = sorted[i];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) {
          upper.pop();
        }
        upper.push(p);
      }

      lower.pop();
      upper.pop();
      return lower.concat(upper);
    }

    function isPointInPolygon(point, vs) {
      let x = point.x, y = point.y;
      let inside = false;
      for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        let xi = vs[i].x, yi = vs[i].y;
        let xj = vs[j].x, yj = vs[j].y;
        let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // 生成「重裝時空泰坦 Boss」
    function spawnBoss() {
      AudioEngine.playBossSpawn();
      STATE.shake = 12;
      popups.push({ x: width / 2, y: height / 2 - 50, text: 'BOSS INCOMING', life: 50, color: '#ef4444' });

      enemies.push({
        x: width / 2,
        y: -50,
        radius: 22, // 巨大體積
        speed: 1.6, // 提高基礎巡航移速 (原 0.65 -> 1.6)
        baseSpeed: 1.6,
        hp: 350 + Math.floor(STATE.gameTime / 600) * 100,
        maxHp: 350 + Math.floor(STATE.gameTime / 600) * 100,
        flash: 0,
        isBoss: true,
        hasShield: true,
        facingAngle: Math.PI / 2,
        // Boss 衝刺與轉向狀態機
        state: 'chase', // chase, windup, dash, cooldown
        stateTimer: 180, // 3秒後發動第一次大衝刺
        dashAngle: 0,
        dashSpeed: 5.5,
        turnRate: 0.04 // 轉向慣性，讓 Boss 轉頭不會瞬間完成
      });
    }

    // 觸發貫穿能量球撞擊本體之「超大範圍時空湮滅大爆炸」
    function triggerOrbSuperExplosion(ox, oy) {
      AudioEngine.playOrbExplode();
      STATE.shake = 15;
      const explodeRadius = 160; // 超大範圍

      popups.push({ x: ox, y: oy - 15, text: 'SUPER NOVA', life: 35, color: '#38bdf8' });

      // 對範圍內所有敵人（包含 Boss，且此大爆炸能直接穿透/瓦解護盾）造成巨大傷害
      for (const e of enemies) {
        const d = Math.hypot(e.x - ox, e.y - oy);
        if (d < explodeRadius) {
          const dmg = Math.floor(120 * (1 - d / explodeRadius) + 40);
          e.hp -= dmg;
          e.flash = 6;
          popups.push({ x: e.x, y: e.y - 10, text: dmg, life: 25, color: '#38bdf8' });
        }
      }

      // 產生壯觀的雙環擴散與粒子爆炸
      for (let i = 0; i < 36; i++) {
        const ang = (i / 36) * Math.PI * 2;
        const spd = 2.5 + Math.random() * 4.5;
        particles.push({
          x: ox,
          y: oy,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 25,
          color: i % 2 === 0 ? '#38bdf8' : '#facc15',
          size: 3
        });
      }
    }

    // --- 渲染畫面 ---
    function render() {
      ctx.save();
      if (STATE.shake > 0) {
        ctx.translate((Math.random() - 0.5) * STATE.shake, (Math.random() - 0.5) * STATE.shake);
        STATE.shake *= 0.88;
        if (STATE.shake < 0.5) STATE.shake = 0;
      }

      ctx.clearRect(0, 0, width, height);

      // 全域相機可視範圍縮放 (0.72x，視野範圍擴大約 1.4 倍，帶來廣闊的戰術空間與回溯走位體驗)
      const cameraScale = 0.72;
      ctx.save();
      ctx.translate(width / 2, height / 2);
      ctx.scale(cameraScale, cameraScale);
      ctx.translate(-width / 2, -height / 2);

      // 細緻背景網格 (延伸至擴展視野外)
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.35)';
      ctx.lineWidth = 0.8;
      const gridSize = 28;
      const margin = 200;
      for (let x = -margin; x < width + margin; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, -margin); ctx.lineTo(x, height + margin); ctx.stroke();
      }
      for (let y = -margin; y < height + margin; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(-margin, y); ctx.lineTo(width + margin, y); ctx.stroke();
      }

      // 1. 殘像結界與連線 (全面套用 Convex Hull 凸包幾何，永遠向外凸起，絕不凹陷或自交)
      if (echoes.length >= 2) {
        const allPoints = [{ x: player.x, y: player.y }, ...echoes.map(e => ({ x: e.x, y: e.y }))];
        const hull = getConvexHull(allPoints);

        if (hull.length >= 3) {
          ctx.save();
          ctx.fillStyle = 'rgba(236, 72, 153, 0.14)';
          ctx.strokeStyle = '#ec4899';
          ctx.lineWidth = 2;
          ctx.shadowColor = '#ec4899';
          ctx.shadowBlur = 14;
          ctx.beginPath();
          ctx.moveTo(hull[0].x, hull[0].y);
          for (let h = 1; h < hull.length; h++) {
            ctx.lineTo(hull[h].x, hull[h].y);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // 結界內部流光光芒
          ctx.strokeStyle = 'rgba(250, 204, 21, 0.35)';
          ctx.lineWidth = 1;
          ctx.setLineDash([6, 6]);
          ctx.stroke();

          ctx.restore();
        }
      } else if (echoes.length === 1) {
        ctx.save();
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 2 + Math.sin(frameCount * 0.2) * 1;
        ctx.shadowColor = '#ec4899';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(echoes[0].x, echoes[0].y);
        ctx.stroke();
        ctx.restore();
      }

      // 殘像實體 (半徑 10px)
      for (const ec of echoes) {
        ctx.save();
        ctx.fillStyle = 'rgba(236, 72, 153, 0.45)';
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 1.8;
        ctx.shadowColor = '#ec4899';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(ec.x, ec.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // 2. 經驗晶體 (微型 2.8px)
      for (const g of gems) {
        ctx.save();
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(g.x, g.y, 2.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 3. 怪物與 Boss 渲染
      for (const e of enemies) {
        ctx.save();
        if (e.isBoss) {
          // Boss 霸體外殼
          ctx.fillStyle = e.flash > 0 ? '#fff' : '#881337';
          ctx.strokeStyle = '#f43f5e';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#f43f5e';
          ctx.shadowBlur = e.flash > 0 ? 16 : 8;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Boss 內部核心晶片
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(e.x, e.y, 7, 0, Math.PI * 2);
          ctx.fill();

          // Boss 正面 160 度「高能能量護盾」渲染 (防禦正面攻擊)
          if (e.hasShield) {
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.rotate(e.facingAngle);
            ctx.beginPath();
            ctx.arc(0, 0, e.radius + 9, -Math.PI * 0.45, Math.PI * 0.45);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.9)';
            ctx.lineWidth = 3.5;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 12;
            ctx.stroke();

            // 護盾弧形光幕層
            ctx.fillStyle = 'rgba(56, 189, 248, 0.18)';
            ctx.lineTo(0, 0);
            ctx.fill();
            ctx.restore();
          }

          // Boss 頂部血條與標籤
          const barW = 44;
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(e.x - barW / 2, e.y - 32, barW, 5);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(e.x - barW / 2, e.y - 32, (e.hp / e.maxHp) * barW, 5);
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1;
          ctx.strokeRect(e.x - barW / 2, e.y - 32, barW, 5);

          ctx.font = 'bold 9px monospace';
          ctx.fillStyle = '#38bdf8';
          ctx.textAlign = 'center';
          ctx.fillText('TITAN BOSS', e.x, e.y - 36);
        } else {
          // 普通怪物
          ctx.fillStyle = e.flash > 0 ? '#fff' : '#f43f5e';
          ctx.strokeStyle = '#9f1239';
          ctx.lineWidth = 1.5;
          ctx.shadowColor = '#f43f5e';
          ctx.shadowBlur = e.flash > 0 ? 8 : 3;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          if (e.hp < e.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(e.x - 9, e.y - 13, 18, 3);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(e.x - 9, e.y - 13, (e.hp / e.maxHp) * 18, 3);
          }
        }
        ctx.restore();
      }

      // 4. 貫穿時空能量球 (自轉脈衝光球)
      for (const orb of energyOrbs) {
        ctx.save();
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 14;
        // 外層引力光環
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius + Math.sin(frameCount * 0.25) * 2, 0, Math.PI * 2);
        ctx.stroke();

        // 核心高能等離子
        const grad = ctx.createRadialGradient(orb.x, orb.y, 2, orb.x, orb.y, orb.radius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, '#38bdf8');
        grad.addColorStop(1, '#0284c7');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 5. 子彈渲染 (主武器：青藍穿甲光束 / 副武器：粉紫量子尋標飛彈 / AI 子彈：紅色 / 殘像：紫光彈)
      for (const b of bullets) {
        ctx.save();
        if (b.isAI) {
          // AI 子彈：紅色發光開路光錐
          const ang = Math.atan2(b.vy, b.vx);
          ctx.translate(b.x, b.y);
          ctx.rotate(ang);
          ctx.fillStyle = '#f43f5e';
          ctx.shadowColor = '#f43f5e';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.moveTo(6, 0);
          ctx.lineTo(-4, -2.5);
          ctx.lineTo(-2, 0);
          ctx.lineTo(-4, 2.5);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (b.isSub) {
          // 副武器追蹤飛彈：粉紫發光圓錐體
          const ang = Math.atan2(b.vy, b.vx);
          ctx.translate(b.x, b.y);
          ctx.rotate(ang);
          ctx.fillStyle = '#ec4899';
          ctx.shadowColor = '#ec4899';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.ellipse(0, 0, 5, 2.8, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(1, 0, 1.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (b.isEcho) {
          // 殘像子彈
          ctx.fillStyle = '#a855f7';
          ctx.shadowColor = '#a855f7';
          ctx.shadowBlur = 6;
          ctx.beginPath();
          ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // 主武器開路子彈：青藍穿甲光錐
          const ang = Math.atan2(b.vy, b.vx);
          ctx.translate(b.x, b.y);
          ctx.rotate(ang);
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.moveTo(6, 0);
          ctx.lineTo(-4, -2.5);
          ctx.lineTo(-2, 0);
          ctx.lineTo(-4, 2.5);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // 5.5 1v1 對決模式：繪製 AI 時空幽靈 (Phantom AI)、AI 殘像與 AI 紅色雷射
      if (STATE.gameMode === 'duel' && phantomAI) {
        // AI 殘像連線雷射 (紅色高能離子割裂線)
        if (phantomAI.echoes.length > 0) {
          for (const aie of phantomAI.echoes) {
            ctx.save();
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(phantomAI.x, phantomAI.y);
            ctx.lineTo(aie.x, aie.y);
            ctx.stroke();

            // 繪製 AI 殘像本體
            ctx.fillStyle = 'rgba(244, 63, 94, 0.4)';
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(aie.x, aie.y, phantomAI.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }
        }

        // 繪製 AI 本體 (粉紅/紫色暗影科技風格)
        ctx.save();
        if (phantomAI.invulnerable > 0 && Math.floor(frameCount / 4) % 2 === 0) {
          ctx.globalAlpha = 0.5;
        }
        ctx.fillStyle = '#ec4899';
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#ec4899';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(phantomAI.x, phantomAI.y, phantomAI.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // AI 前進方向箭頭
        ctx.save();
        ctx.translate(phantomAI.x, phantomAI.y);
        ctx.rotate(phantomAI.facingAngle);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(phantomAI.radius + 6, 0);
        ctx.lineTo(phantomAI.radius - 2, -4);
        ctx.lineTo(phantomAI.radius - 2, 4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(phantomAI.x, phantomAI.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 5.8 軌道光刃
      if (player.orbitalBlade > 0) {
        const bladeDist = 40;
        for (let b = 0; b < player.orbitalBlade; b++) {
          const ang = player.bladeAngle + (b * (Math.PI * 2 / player.orbitalBlade));
          const bx = player.x + Math.cos(ang) * bladeDist;
          const by = player.y + Math.sin(ang) * bladeDist;
          ctx.save();
          ctx.fillStyle = '#facc15';
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(bx, by, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // 6. 3 秒前「時空回溯預覽殘像」 (Ghost Preview)
      if (player.history.length >= 15 && player.echoCharges > 0) {
        const previewState = player.history[0];
        ctx.save();
        
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(previewState.x, previewState.y);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.stroke();

        const pulse = 0.35 + Math.sin(frameCount * 0.15) * 0.15;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(previewState.x, previewState.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(previewState.x, previewState.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // 7. 玩家本體 (半徑 10px) + 前進朝向指針
      ctx.save();
      if (player.invulnerable > 0 && Math.floor(frameCount / 4) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }
      ctx.fillStyle = '#38bdf8';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.facingAngle);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(player.radius + 6, 0);
      ctx.lineTo(player.radius - 2, -4);
      ctx.lineTo(player.radius - 2, 4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 7. 粒子效果
      for (const p of particles) {
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 20;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 8. 傷害飄字
      for (const pu of popups) {
        ctx.save();
        ctx.font = 'bold 11px monospace';
        ctx.fillStyle = pu.color;
        ctx.globalAlpha = pu.life / 20;
        ctx.fillText(`-${pu.text}`, pu.x, pu.y);
        ctx.restore();
      }

      ctx.restore(); // 閉合相機縮放層 (cameraScale)
      ctx.restore(); // 閉合震屏層 (shake)
    }

    function gameOver(isVictory = false) {
      STATE.isGameOver = true;
      const modal = document.getElementById('gameover-modal');
      const sec = Math.floor(STATE.gameTime / 60);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      document.getElementById('final-time').innerText = `${mm}:${ss}`;

      const titleEl = modal.querySelector('.gameover-title');
      if (STATE.gameMode === 'duel') {
        if (isVictory) {
          titleEl.innerText = 'VICTORY - 時空支配者';
          titleEl.style.color = '#facc15';
          document.getElementById('final-kills').innerText = 'AI DEFEATED';
        } else {
          titleEl.innerText = 'DEFEAT - 被時空幽靈吞噬';
          titleEl.style.color = '#f43f5e';
          document.getElementById('final-kills').innerText = 'FAILED';
        }
      } else {
        titleEl.innerText = '時空線崩塌';
        titleEl.style.color = '#38bdf8';
        document.getElementById('final-kills').innerText = STATE.kills;
      }
      modal.classList.add('active');
    }

    // --- 首頁 Canvas 幾何共振三芒星物理渲染器 ---
    const homeCanvas = document.getElementById('home-canvas');
    let homeCtx = homeCanvas ? homeCanvas.getContext('2d') : null;
    let homeTime = 0;
    let homeParticles = Array.from({ length: 30 }, () => ({
      x: Math.random() * (window.innerWidth || 800),
      y: Math.random() * (window.innerHeight || 600),
      vx: (Math.random() - 0.5) * 0.7,
      vy: (Math.random() - 0.5) * 0.7,
      size: Math.random() * 2.2 + 1,
      alpha: Math.random() * 0.5 + 0.2
    }));

    function resizeHomeCanvas() {
      if (!homeCanvas) return;
      homeCanvas.width = window.innerWidth;
      homeCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeHomeCanvas);
    resizeHomeCanvas();

    function renderHomeScreenCanvas() {
      if (!homeCtx || !homeCanvas || STATE.isStarted) return;
      const hw = homeCanvas.width;
      const hh = homeCanvas.height;
      homeCtx.clearRect(0, 0, hw, hh);
      homeTime += 0.02;

      const cx = hw / 2;
      const cy = hh / 2;
      const rx = Math.min(hw * 0.35, 340);
      const ry = Math.min(hh * 0.28, 190);

      // 本體光球與 2 個殘像座標
      const pMain = { x: cx + Math.cos(homeTime) * rx, y: cy + Math.sin(homeTime * 1.2) * ry };
      const pEcho1 = { x: cx + Math.cos(homeTime - 1.8) * rx, y: cy + Math.sin((homeTime - 1.8) * 1.2) * ry };
      const pEcho2 = { x: cx + Math.cos(homeTime - 3.6) * rx, y: cy + Math.sin((homeTime - 3.6) * 1.2) * ry };

      // 1. 幾何三芒星封閉能量結界面
      homeCtx.beginPath();
      homeCtx.moveTo(pMain.x, pMain.y);
      homeCtx.lineTo(pEcho1.x, pEcho1.y);
      homeCtx.lineTo(pEcho2.x, pEcho2.y);
      homeCtx.closePath();
      homeCtx.fillStyle = 'rgba(168, 85, 247, 0.06)';
      homeCtx.fill();

      // 2. 高能共振連線 (青藍色電射光芒)
      homeCtx.lineWidth = 2;
      homeCtx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
      homeCtx.shadowColor = '#38bdf8';
      homeCtx.shadowBlur = 14;
      homeCtx.stroke();
      homeCtx.shadowBlur = 0;

      // 3. 虛線時間回溯軌跡
      homeCtx.beginPath();
      homeCtx.setLineDash([4, 6]);
      homeCtx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      homeCtx.lineWidth = 1;
      for (let i = 0; i <= 40; i++) {
        const t = homeTime - (i / 40) * 3.6;
        const tx = cx + Math.cos(t) * rx;
        const ty = cy + Math.sin(t * 1.2) * ry;
        if (i === 0) homeCtx.moveTo(tx, ty);
        else homeCtx.lineTo(tx, ty);
      }
      homeCtx.stroke();
      homeCtx.setLineDash([]);

      // 4. 時空微粒
      homeParticles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = hw; if (p.x > hw) p.x = 0;
        if (p.y < 0) p.y = hh; if (p.y > hh) p.y = 0;
        homeCtx.beginPath();
        homeCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        homeCtx.fillStyle = `rgba(255, 255, 255, ${p.alpha * 0.4})`;
        homeCtx.fill();
      });

      // 5. 兩枚殘像光球 (Echo Orbs)
      [pEcho1, pEcho2].forEach(echo => {
        homeCtx.beginPath();
        homeCtx.arc(echo.x, echo.y, 16, 0, Math.PI * 2);
        homeCtx.fillStyle = 'rgba(168, 85, 247, 0.25)';
        homeCtx.fill();

        homeCtx.beginPath();
        homeCtx.arc(echo.x, echo.y, 8, 0, Math.PI * 2);
        homeCtx.fillStyle = '#a855f7';
        homeCtx.shadowColor = '#a855f7';
        homeCtx.shadowBlur = 16;
        homeCtx.fill();
        homeCtx.shadowBlur = 0;
      });

      // 6. 本體核心光球 (Main Core Orb)
      const pulse = 22 + Math.sin(homeTime * 4) * 3;
      homeCtx.beginPath();
      homeCtx.arc(pMain.x, pMain.y, pulse, 0, Math.PI * 2);
      homeCtx.fillStyle = 'rgba(56, 189, 248, 0.22)';
      homeCtx.fill();

      homeCtx.beginPath();
      homeCtx.arc(pMain.x, pMain.y, 11, 0, Math.PI * 2);
      homeCtx.fillStyle = '#ffffff';
      homeCtx.shadowColor = '#38bdf8';
      homeCtx.shadowBlur = 24;
      homeCtx.fill();
      homeCtx.shadowBlur = 0;

      requestAnimationFrame(renderHomeScreenCanvas);
    }
    requestAnimationFrame(renderHomeScreenCanvas);

    // --- 幀率鎖定與固定時間步長 (Fixed Timestep 60FPS 防高刷螢幕加速) ---
    let lastTime = performance.now();
    let accumulator = 0;
    const TIME_STEP = 1000 / 60; // 嚴格鎖定 16.666ms 一個邏輯更新幀

    function loop(currentTime) {
      if (!currentTime) currentTime = performance.now();
      let delta = currentTime - lastTime;
      lastTime = currentTime;

      // 避免背景切換或卡頓導致的螺旋延遲 (Spiral of Death)
      if (delta > 250) delta = 250;
      accumulator += delta;

      // 無論螢幕是 60Hz, 90Hz, 120Hz, 144Hz，邏輯更新頻率嚴格鎖定在 60 次/秒
      while (accumulator >= TIME_STEP) {
        update();
        accumulator -= TIME_STEP;
      }

      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
