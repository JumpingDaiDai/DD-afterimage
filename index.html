<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Afterimage">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#070913">
  <title>殘像 (Afterimage) v0.0.4</title>
  <style>
    :root {
      --bg: #070913;
      --primary: #38bdf8;
      --accent: #ec4899;
      --gold: #facc15;
      --purple: #a855f7;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      color: #fff;
      touch-action: none;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    /* 懸浮 HUD 介面 */
    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 12px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .bar-container {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 2px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 150px;
    }
    .bar-label { font-size: 10px; font-weight: 800; color: #94a3b8; width: 26px; }
    .bar-track {
      flex: 1;
      height: 6px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }
    .hp-fill { background: linear-gradient(90deg, #ef4444, #f43f5e); }
    .exp-fill { background: linear-gradient(90deg, #06b6d4, #38bdf8); }
    .hud-right {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 4px 12px;
      text-align: right;
      pointer-events: auto;
    }
    .score-text { font-size: 13px; font-weight: 800; color: var(--gold); }
    .timer-text { font-size: 11px; color: #cbd5e1; font-family: monospace; }
    .doc-link {
      font-size: 10px;
      color: var(--primary);
      text-decoration: none;
      display: inline-block;
      margin-top: 2px;
      font-weight: bold;
    }

    /* 方案 A 控制區：左側固定搖桿 + 右側清晰雙技能鍵 */
    .controls-layer {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 20px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 20;
      pointer-events: none;
    }
    #joystick-base {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px dashed rgba(56, 189, 248, 0.4);
      position: relative;
      pointer-events: auto;
      backdrop-filter: blur(4px);
    }
    #joystick-stick {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary), #0284c7);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      position: absolute;
      top: 29px;
      left: 29px;
      pointer-events: none;
      transform: translate(0px, 0px);
      transition: transform 0.05s ease-out;
    }
    .action-buttons {
      display: flex;
      gap: 14px;
      pointer-events: auto;
    }
    .btn-action {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s, opacity 0.2s;
      position: relative;
    }
    .btn-action:active { transform: scale(0.9); }
    .btn-action.disabled {
      filter: grayscale(0.9);
      opacity: 0.4;
      pointer-events: none;
    }
    .btn-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #38bdf8;
      color: #070913;
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
      border: 1.5px solid #070913;
    }
    .btn-echo {
      background: radial-gradient(circle, #ec4899, #be185d);
      box-shadow: 0 0 16px rgba(236, 72, 153, 0.6);
    }
    .btn-swap {
      background: radial-gradient(circle, #facc15, #ca8a04);
      box-shadow: 0 0 16px rgba(250, 204, 21, 0.6);
    }
    .btn-icon { font-size: 15px; font-weight: 900; }
    .btn-lbl { font-size: 10px; font-weight: 800; color: #fff; margin-top: 1px; }

    /* 升級三選一彈窗 (z-index 提高至 200，pointer-events: auto) */
    .upgrade-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 9, 19, 0.85);
      backdrop-filter: blur(12px);
      z-index: 200;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      pointer-events: auto;
    }
    .upgrade-modal.active { display: flex; }
    .upgrade-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 16px;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.5);
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 360px;
      pointer-events: auto;
    }
    .upgrade-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .upgrade-card:hover, .upgrade-card:active {
      border-color: var(--primary);
      transform: translateY(-2px);
      background: #243248;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
    }
    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }
    .card-icon svg {
      width: 24px;
      height: 24px;
      display: block;
    }
    .card-info h4 { font-size: 14px; color: #fff; margin-bottom: 2px; }
    .card-info p { font-size: 11px; color: #94a3b8; }

    /* 遊戲結束彈窗 (z-index 提高至 210) */
    .gameover-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 9, 19, 0.9);
      backdrop-filter: blur(12px);
      z-index: 210;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      pointer-events: auto;
    }
    .gameover-modal.active { display: flex; }
    /* 首頁 (Title / Home Screen) */
    .home-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.88), rgba(7, 9, 19, 0.96));
      backdrop-filter: blur(14px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .home-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .game-logo {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #38bdf8, #ec4899, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.4));
    }
    .game-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
      font-weight: 500;
    }
    .version-tag {
      font-size: 11px;
      font-family: monospace;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 999px;
      padding: 3px 10px;
      margin-bottom: 28px;
      display: inline-block;
    }
    .btn-start {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #070913;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 14px 44px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      touch-action: manipulation;
    }
    .btn-start:active {
      transform: scale(0.94);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .home-features {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }
    .home-link-btn {
      font-size: 12px;
      color: #cbd5e1;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .home-link-btn:active { background: rgba(255, 255, 255, 0.12); }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- 頂部 HUD -->
  <div class="hud">
    <div class="hud-left">
      <div class="bar-container">
        <span class="bar-label">HP</span>
        <div class="bar-track"><div id="hp-bar" class="bar-fill hp-fill"></div></div>
      </div>
      <div class="bar-container">
        <span class="bar-label">LV.<span id="level-num">1</span></span>
        <div class="bar-track"><div id="exp-bar" class="bar-fill exp-fill" style="width: 0%;"></div></div>
      </div>
    </div>
    <div class="hud-right">
      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
        <div class="score-text">KILLS <span id="kill-count">0</span></div>
        <button id="btn-fullscreen" title="全螢幕" style="background: none; border: none; font-size: 14px; color: #7dd3fc; cursor: pointer; padding: 2px 4px;">[ ]</button>
      </div>
      <div class="timer-text" id="time-display">00:00</div>
      <a href="manual.html" class="doc-link">玩法手冊</a>
    </div>
  </div>

  <!-- 方案 A 控制層：左搖桿 + 右側清晰雙鍵 -->
  <div class="controls-layer">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
    <div class="action-buttons">
      <button id="btn-echo" class="btn-action btn-echo">
        <span id="echo-badge" class="btn-badge">2</span>
        <span class="btn-icon">REWIND</span>
        <span class="btn-lbl" id="echo-lbl">回溯</span>
      </button>
      <button id="btn-swap" class="btn-action btn-swap disabled">
        <span class="btn-icon">SWAP</span>
        <span class="btn-lbl">換位</span>
      </button>
    </div>
  </div>

  <!-- 遊戲首頁 (Title Screen) -->
  <div id="home-screen" class="home-screen">
    <div class="game-logo">殘像</div>
    <div class="game-subtitle">時間倒流 × 殘像協同作戰 × 共振殺陣</div>
    <div class="version-tag">Version 0.0.4</div>
    <button id="btn-start" class="btn-start">START GAME</button>
    <div class="home-features">
      <a href="manual.html" class="home-link-btn">玩法手冊</a>
      <button onclick="window.location.href=window.location.pathname+'?t='+Date.now()" class="home-link-btn" style="cursor: pointer;">強制重整</button>
    </div>
  </div>

  <!-- 升級彈窗 -->
  <div id="upgrade-modal" class="upgrade-modal">
    <div class="upgrade-title">選擇時空突破天賦</div>
    <div id="card-list" class="card-list"></div>
  </div>

  <!-- 結算彈窗 -->
  <div id="gameover-modal" class="gameover-modal">
    <h2 style="font-size: 26px; color: #ef4444; margin-bottom: 6px;">時空線崩塌</h2>
    <p style="color: #94a3b8; font-size: 13px;">你在時空狂潮中堅持了 <span id="final-time" style="color: #fff; font-weight: bold;"></span></p>
    <p style="color: #94a3b8; font-size: 13px; margin-top: 4px;">消滅異變體：<span id="final-kills" style="color: var(--gold); font-weight: bold;"></span></p>
    <button class="btn-restart" onclick="location.reload()">重啟時間線</button>
  </div>

  <script>
    // --- 遊戲核心引擎 ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    let width = 0, height = 0;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 遊戲狀態
    const STATE = {
      isStarted: false,
      isPaused: false,
      isGameOver: false,
      gameTime: 0,
      kills: 0,
      level: 1,
      exp: 0,
      maxExp: 8,
      shake: 0
    };

    // 音效合成系統 (Web Audio)
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      playLaser() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(750, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      playHit() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.06);
      },
      playRewind() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(1000, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
      },
      playSwap() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(380, this.ctx.currentTime);
        osc.frequency.setValueAtTime(760, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      },
      playGem() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900, this.ctx.currentTime);
        osc.frequency.setValueAtTime(1400, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      playShieldBlock() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      playOrbLaunch() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      },
      playOrbExplode() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.35);
      },
      playBossSpawn() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(90, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(180, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.5);
      }
    };

    // --- 瀏覽器原生長按、文字選取、放大鏡手勢【全域絕對阻斷】 ---
    window.addEventListener('contextmenu', e => e.preventDefault(), { passive: false, capture: true });
    window.addEventListener('selectstart', e => e.preventDefault(), { passive: false, capture: true });
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
      window.addEventListener(evt, e => e.preventDefault(), { passive: false, capture: true });
    });

    // 針對全螢幕 window 阻斷非按鈕區域的系統長按放大鏡
    window.addEventListener('touchstart', e => {
      // 若非互動按鈕/彈窗卡片，全面執行 preventDefault
      const isInteractive = e.target && (
        e.target.closest('button') || 
        e.target.closest('a') || 
        e.target.closest('#joystick-base') ||
        e.target.closest('.upgrade-card') ||
        e.target.closest('.btn-restart')
      );
      if (!isInteractive && e.cancelable) {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      // 全螢幕遊戲完全禁止瀏覽器橡皮筋滾動
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    document.getElementById('btn-fullscreen').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});

    // --- 方案 A：左側固定搖桿控制 (嚴格使用 Touch 事件並主動 preventDefault 徹底封殺 iOS 放大鏡) ---
    const joyBase = document.getElementById('joystick-base');
    const joyStick = document.getElementById('joystick-stick');
    let joyTouchId = null;
    let joyOrigin = null;
    let joyVec = { x: 0, y: 0 };

    joyBase.addEventListener('touchstart', e => {
      e.preventDefault(); // 阻斷 iOS Safari 長按放大鏡與選取
      AudioEngine.init();
      const touch = e.changedTouches[0];
      joyTouchId = touch.identifier;
      const rect = joyBase.getBoundingClientRect();
      joyOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      handleJoyDrag(touch);
    }, { passive: false });

    joyBase.addEventListener('touchmove', e => {
      e.preventDefault(); // 阻斷滾動與長按
      if (joyOrigin) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === joyTouchId) {
            handleJoyDrag(e.changedTouches[i]);
            break;
          }
        }
      }
    }, { passive: false });

    function endJoyDrag(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          joyTouchId = null;
          joyOrigin = null;
          joyVec = { x: 0, y: 0 };
          joyStick.style.transform = 'translate(0px, 0px)';
          break;
        }
      }
    }
    joyBase.addEventListener('touchend', endJoyDrag, { passive: false });
    joyBase.addEventListener('touchcancel', endJoyDrag, { passive: false });

    // 電腦端滑鼠相容
    joyBase.addEventListener('mousedown', e => {
      e.preventDefault();
      AudioEngine.init();
      const rect = joyBase.getBoundingClientRect();
      joyOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      const onMouseMove = (me) => handleJoyDrag(me);
      const onMouseUp = () => {
        joyOrigin = null;
        joyVec = { x: 0, y: 0 };
        joyStick.style.transform = 'translate(0px, 0px)';
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
      };
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      handleJoyDrag(e);
    });

    function handleJoyDrag(pos) {
      const dx = pos.clientX - joyOrigin.x;
      const dy = pos.clientY - joyOrigin.y;
      const dist = Math.hypot(dx, dy);
      const maxR = 32;
      const angle = Math.atan2(dy, dx);
      const clamped = Math.min(dist, maxR);

      joyVec.x = (clamped / maxR) * Math.cos(angle);
      joyVec.y = (clamped / maxR) * Math.sin(angle);

      joyStick.style.transform = `translate(${Math.cos(angle) * clamped}px, ${Math.sin(angle) * clamped}px)`;
    }

    // 觸發回溯 (消耗 1 次充能，只要有充能即可無縫連放)
    function triggerEcho() {
      if (player.echoCharges <= 0 || player.history.length < 15) return;
      AudioEngine.playRewind();
      STATE.shake = 8;

      player.echoCharges--;
      if (player.echoChargeTimer <= 0) {
        player.echoChargeTimer = player.maxEchoChargeCd;
      }

      const oldState = player.history[0];
      const recordedActions = [...player.history];

      // 若場上殘像超過上限，頂替最早的殘像
      if (echoes.length >= player.maxEchoCount) {
        echoes.shift();
      }

      // 殘像存活延長至 8 秒 (480 幀)，軌跡自動循環重播
      echoes.push({
        frames: recordedActions,
        currentFrame: 0,
        x: player.x,
        y: player.y,
        lifeTimer: 480 // 8 秒超長駐留
      });

      player.x = oldState.x;
      player.y = oldState.y;
      player.invulnerable = 35;
      player.history = []; // 清空重記

      for (let i = 0; i < 16; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 3;
        particles.push({
          x: player.x, y: player.y,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          life: 20, color: '#38bdf8', size: 2
        });
      }
    }

    // 觸發換位
    function triggerSwap() {
      if (echoes.length === 0) return;
      AudioEngine.playSwap();
      STATE.shake = 6;

      // 與最新或唯一的殘像換位
      const targetEcho = echoes[echoes.length - 1];
      const px = player.x;
      const py = player.y;

      player.x = targetEcho.x;
      player.y = targetEcho.y;
      targetEcho.x = px;
      targetEcho.y = py;

      player.invulnerable = 20;

      for (let i = 0; i < 12; i++) {
        const t = Math.random();
        particles.push({
          x: px + (player.x - px) * t,
          y: py + (player.y - py) * t,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          life: 18, color: '#facc15', size: 2.5
        });
      }
    }

    // --- 遊戲主循環 ---
    let frameCount = 0;
    function update() {
      if (!STATE.isStarted || STATE.isPaused || STATE.isGameOver) return;
      frameCount++;
      STATE.gameTime++;

      // 1. 移動計算 (放手時即原地停下)
      let moveX = 0, moveY = 0;
      if (keys['w'] || keys['arrowup']) moveY -= 1;
      if (keys['s'] || keys['arrowdown']) moveY += 1;
      if (keys['a'] || keys['arrowleft']) moveX -= 1;
      if (keys['d'] || keys['arrowright']) moveX += 1;

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        moveX = (moveX / len) * player.speed;
        moveY = (moveY / len) * player.speed;
      } else if (joyOrigin) {
        moveX = joyVec.x * player.speed;
        moveY = joyVec.y * player.speed;
      }

      player.x = Math.max(player.radius, Math.min(width - player.radius, player.x + moveX));
      player.y = Math.max(player.radius, Math.min(height - player.radius, player.y + moveY));

      // 紀錄歷史
      player.history.push({ x: player.x, y: player.y, shooting: player.attackCd <= 0 });
      if (player.history.length > player.maxHistory) {
        player.history.shift();
      }

      // 回溯充能恢復邏輯 (低於最大充能時自動倒數充能)
      if (player.echoCharges < player.maxEchoCharges) {
        player.echoChargeTimer--;
        if (player.echoChargeTimer <= 0) {
          player.echoCharges++;
          if (player.echoCharges < player.maxEchoCharges) {
            player.echoChargeTimer = player.maxEchoChargeCd;
          }
        }
      }

      // 2. 自動射擊
      player.attackCd--;
      if (player.attackCd <= 0 && enemies.length > 0) {
        let nearest = null, minDist = Infinity;
        for (const e of enemies) {
          const d = Math.hypot(e.x - player.x, e.y - player.y);
          if (d < minDist) { minDist = d; nearest = e; }
        }
        if (nearest) {
          const baseAng = Math.atan2(nearest.y - player.y, nearest.x - player.x);
          const spread = 0.14;
          const startOffset = -(player.shootCount - 1) * spread / 2;
          for (let i = 0; i < player.shootCount; i++) {
            const ang = baseAng + startOffset + i * spread;
            bullets.push({
              x: player.x, y: player.y,
              vx: Math.cos(ang) * 8.5, vy: Math.sin(ang) * 8.5,
              damage: 18, life: 55, isEcho: false
            });
          }
          AudioEngine.playLaser();
          player.attackCd = player.attackSpeed;
        }
      }

      // 3. 殘像更新 (循環重播軌跡，持續存活 8 秒)
      for (let i = echoes.length - 1; i >= 0; i--) {
        const ec = echoes[i];
        ec.lifeTimer--;

        if (ec.frames.length > 0) {
          const record = ec.frames[ec.currentFrame % ec.frames.length];
          ec.x = record.x;
          ec.y = record.y;
          ec.currentFrame++;

          if (record.shooting && enemies.length > 0) {
            let nearest = null, minDist = Infinity;
            for (const e of enemies) {
              const d = Math.hypot(e.x - ec.x, e.y - ec.y);
              if (d < minDist) { minDist = d; nearest = e; }
            }
            if (nearest) {
              const ang = Math.atan2(nearest.y - ec.y, nearest.x - ec.x);
              bullets.push({
                x: ec.x, y: ec.y,
                vx: Math.cos(ang) * 7.5, vy: Math.sin(ang) * 7.5,
                damage: 14, life: 50, isEcho: true
              });
            }
          }
        }

        if (ec.lifeTimer <= 0) {
          for (let p = 0; p < 12; p++) {
            const ang = Math.random() * Math.PI * 2;
            particles.push({
              x: ec.x, y: ec.y,
              vx: Math.cos(ang) * 3, vy: Math.sin(ang) * 3,
              life: 20, color: '#a855f7', size: 2
            });
          }
          echoes.splice(i, 1);
        }
      }

      // 殘像雷射割裂與結界判定 (縮小碰撞容錯)
      if (echoes.length === 1) {
        const ec = echoes[0];
        for (const enemy of enemies) {
          if (pointToSegmentDist(enemy.x, enemy.y, player.x, player.y, ec.x, ec.y) < enemy.radius + 4) {
            enemy.hp -= player.resonanceDmg;
            enemy.flash = 2;
          }
        }
      } else if (echoes.length >= 2) {
        const poly = [{ x: player.x, y: player.y }, ...echoes.map(e => ({ x: e.x, y: e.y }))];
        for (const enemy of enemies) {
          if (isPointInPolygon({ x: enemy.x, y: enemy.y }, poly)) {
            enemy.hp -= player.resonanceDmg * 1.5;
            enemy.flash = 2;
            if (Math.random() < 0.2) {
              particles.push({
                x: enemy.x, y: enemy.y,
                vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
                life: 10, color: '#facc15', size: 1.8
              });
            }
          }
        }
      }

      // 軌道光刃 (縮小環繞半徑至 40px)
      if (player.orbitalBlade > 0) {
        player.bladeAngle += 0.05;
        const bladeDist = 40;
        for (let b = 0; b < player.orbitalBlade; b++) {
          const ang = player.bladeAngle + (b * (Math.PI * 2 / player.orbitalBlade));
          const bx = player.x + Math.cos(ang) * bladeDist;
          const by = player.y + Math.sin(ang) * bladeDist;
          for (const e of enemies) {
            if (Math.hypot(e.x - bx, e.y - by) < e.radius + 7) {
              e.hp -= 1.2;
              e.flash = 2;
            }
          }
        }
      }

      // 4. 自動發射貫穿時空能量球 (穿透敵人，若被本體/回溯殘像換位撞擊則引發超大範圍湮滅爆炸)
      player.orbCd--;
      if (player.orbCd <= 0) {
        let nearest = null, minDist = Infinity;
        for (const e of enemies) {
          const d = Math.hypot(e.x - player.x, e.y - player.y);
          if (d < minDist) { minDist = d; nearest = e; }
        }
        const ang = nearest ? Math.atan2(nearest.y - player.y, nearest.x - player.x) : Math.random() * Math.PI * 2;
        energyOrbs.push({
          x: player.x,
          y: player.y,
          vx: Math.cos(ang) * 4.2,
          vy: Math.sin(ang) * 4.2,
          radius: 12,
          damage: 24,
          life: 240, // 存活 4 秒
          armDelay: 20 // 發射 20 幀後解鎖與本體碰撞（防止發射瞬間就自爆）
        });
        AudioEngine.playOrbLaunch();
        player.orbCd = player.maxOrbCd;
      }

      // 更新貫穿能量球
      for (let i = energyOrbs.length - 1; i >= 0; i--) {
        const orb = energyOrbs[i];
        orb.x += orb.vx;
        orb.y += orb.vy;
        orb.life--;
        if (orb.armDelay > 0) orb.armDelay--;

        // 能量球粒子尾跡
        if (frameCount % 2 === 0) {
          particles.push({
            x: orb.x + (Math.random() - 0.5) * 8,
            y: orb.y + (Math.random() - 0.5) * 8,
            vx: -orb.vx * 0.2,
            vy: -orb.vy * 0.2,
            life: 14,
            color: '#38bdf8',
            size: 2.5
          });
        }

        // 穿透所有敵人造成傷害
        for (const e of enemies) {
          if (Math.hypot(e.x - orb.x, e.y - orb.y) < e.radius + orb.radius) {
            // 計算攻擊角度與 Boss 護盾
            let blocked = false;
            if (e.isBoss && e.hasShield) {
              const hitAngle = Math.atan2(orb.y - e.y, orb.x - e.x);
              const angleDiff = Math.abs(normalizeAngle(hitAngle - e.facingAngle));
              if (angleDiff < Math.PI * 0.45) {
                blocked = true; // 正面 160 度扇形護盾阻擋
                AudioEngine.playShieldBlock();
                popups.push({ x: e.x, y: e.y - 14, text: 'BLOCKED', life: 18, color: '#38bdf8' });
              }
            }
            if (!blocked) {
              e.hp -= orb.damage * 0.3; // 穿透時每幀造成高頻切割傷害
              e.flash = 2;
            }
          }
        }

        // 核心機制：能量球若碰到了「自己的本體」-> 引爆大範圍時空湮滅！
        if (orb.armDelay <= 0 && Math.hypot(player.x - orb.x, player.y - orb.y) < player.radius + orb.radius) {
          triggerOrbSuperExplosion(orb.x, orb.y);
          energyOrbs.splice(i, 1);
          continue;
        }

        // 穿透飛出螢幕邊界外直接自然消逝（不反彈）
        const isOutOfScreen = orb.x < -50 || orb.x > width + 50 || orb.y < -50 || orb.y > height + 50;
        if (orb.life <= 0 || isOutOfScreen) {
          energyOrbs.splice(i, 1);
        }
      }

      // 5. 普通子彈更新 (帶有 Boss 正面護盾檢測)
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        for (const e of enemies) {
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + 3) {
            let blocked = false;
            if (e.isBoss && e.hasShield) {
              const hitAngle = Math.atan2(b.y - e.y, b.x - e.x);
              const angleDiff = Math.abs(normalizeAngle(hitAngle - e.facingAngle));
              // 正面 160 度範圍被護盾完全吸收
              if (angleDiff < Math.PI * 0.45) {
                blocked = true;
                AudioEngine.playShieldBlock();
                popups.push({ x: e.x, y: e.y - 12, text: 'GUARD', life: 16, color: '#38bdf8' });
                // 護盾火花
                for (let p = 0; p < 4; p++) {
                  particles.push({
                    x: b.x, y: b.y,
                    vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
                    life: 10, color: '#38bdf8', size: 2
                  });
                }
              }
            }

            if (!blocked) {
              e.hp -= b.damage;
              e.flash = 3;
              AudioEngine.playHit();
              popups.push({ x: e.x, y: e.y - 8, text: b.damage, life: 20, color: b.isEcho ? '#ec4899' : '#38bdf8' });
            }
            b.life = 0;
            break;
          }
        }
        if (b.life <= 0) bullets.splice(i, 1);
      }

      // 6. 怪物與 Boss 生成 (每 45 秒生成一隻「重裝時空泰坦 Boss」)
      const isBossTime = STATE.gameTime > 0 && STATE.gameTime % 2700 === 0;
      if (isBossTime) {
        spawnBoss();
      }

      const spawnInterval = Math.max(18, 60 - Math.floor(STATE.gameTime / 300));
      if (frameCount % spawnInterval === 0) {
        const edge = Math.floor(Math.random() * 4);
        let ex = 0, ey = 0;
        if (edge === 0) { ex = Math.random() * width; ey = -40; }
        else if (edge === 1) { ex = width + 40; ey = Math.random() * height; }
        else if (edge === 2) { ex = Math.random() * width; ey = height + 40; }
        else { ex = -40; ey = Math.random() * height; }

        enemies.push({
          x: ex, y: ey,
          radius: 8,
          speed: 1.1 + Math.random() * 0.7,
          hp: 22 + Math.floor(STATE.gameTime / 400) * 8,
          maxHp: 22 + Math.floor(STATE.gameTime / 400) * 8,
          flash: 0,
          isBoss: false
        });
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.flash > 0) e.flash--;

        let target = player;
        if (echoes.length > 0 && i % 2 === 0) {
          target = echoes[0];
        }

        if (e.isBoss) {
          // Boss 專屬狀態機 (追擊 -> 蓄力預警 -> 超速直線衝鋒 -> 短暫硬直)
          e.stateTimer--;

          if (e.state === 'chase') {
            const targetAng = Math.atan2(target.y - e.y, target.x - e.x);
            // 平滑轉向（加入角速度限制，防止瞬間調頭護盾始終擋住玩家）
            let angleDiff = normalizeAngle(targetAng - e.facingAngle);
            e.facingAngle += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), e.turnRate);

            e.x += Math.cos(e.facingAngle) * e.speed;
            e.y += Math.sin(e.facingAngle) * e.speed;

            if (e.stateTimer <= 0) {
              // 進入蓄力狀態
              e.state = 'windup';
              e.stateTimer = 45; // 蓄力 0.75 秒
              e.dashAngle = Math.atan2(player.y - e.y, player.x - e.x);
              e.facingAngle = e.dashAngle;
              popups.push({ x: e.x, y: e.y - 30, text: 'CHARGE LOCK', life: 30, color: '#facc15' });
            }
          } else if (e.state === 'windup') {
            // 蓄力微震與聚能粒子
            if (frameCount % 3 === 0) {
              particles.push({
                x: e.x + (Math.random() - 0.5) * 30,
                y: e.y + (Math.random() - 0.5) * 30,
                vx: -Math.cos(e.dashAngle) * 3,
                vy: -Math.sin(e.dashAngle) * 3,
                life: 12,
                color: '#facc15',
                size: 2.5
              });
            }
            if (e.stateTimer <= 0) {
              // 發動超速大直線衝撞
              e.state = 'dash';
              e.stateTimer = 40; // 衝刺 40 幀 (移動超過 220px，必定衝過玩家身後！)
              STATE.shake = 10;
              AudioEngine.playOrbLaunch();
            }
          } else if (e.state === 'dash') {
            // 直線高速衝刺，不追蹤
            e.x += Math.cos(e.dashAngle) * e.dashSpeed;
            e.y += Math.sin(e.dashAngle) * e.dashSpeed;

            // 衝刺尾跡火花
            particles.push({
              x: e.x - Math.cos(e.dashAngle) * e.radius,
              y: e.y - Math.sin(e.dashAngle) * e.radius,
              vx: (Math.random() - 0.5) * 2,
              vy: (Math.random() - 0.5) * 2,
              life: 16,
              color: '#f43f5e',
              size: 3
            });

            if (e.stateTimer <= 0) {
              e.state = 'cooldown';
              e.stateTimer = 60; // 衝完後短暫冷卻 1 秒，給玩家充足時間背刺！
            }
          } else if (e.state === 'cooldown') {
            // 冷卻減速緩行
            e.x += Math.cos(e.dashAngle) * 0.4;
            e.y += Math.sin(e.dashAngle) * 0.4;
            if (e.stateTimer <= 0) {
              e.state = 'chase';
              e.stateTimer = 180; // 3 秒後準備下一輪衝刺
            }
          }

          // 邊界防出界
          e.x = Math.max(e.radius, Math.min(width - e.radius, e.x));
          e.y = Math.max(e.radius, Math.min(height - e.radius, e.y));
        } else {
          // 普通怪物追擊
          const angle = Math.atan2(target.y - e.y, target.x - e.x);
          e.facingAngle = angle;
          e.x += Math.cos(angle) * e.speed;
          e.y += Math.sin(angle) * e.speed;
        }

        if (Math.hypot(e.x - player.x, e.y - player.y) < e.radius + player.radius) {
          if (player.invulnerable <= 0) {
            player.hp -= e.isBoss ? 28 : 12;
            player.invulnerable = 30;
            STATE.shake = e.isBoss ? 12 : 6;
            AudioEngine.playHit();
            if (player.hp <= 0) {
              player.hp = 0;
              gameOver();
            }
          }
        }

        if (e.hp <= 0) {
          STATE.kills++;
          if (e.isBoss) {
            // Boss 死亡掉落大量經驗晶體與劇烈震動
            STATE.shake = 16;
            for (let g = 0; g < 12; g++) {
              gems.push({ x: e.x + (Math.random() - 0.5) * 40, y: e.y + (Math.random() - 0.5) * 40, exp: 5 });
            }
            popups.push({ x: e.x, y: e.y - 20, text: 'BOSS DEFEATED', life: 40, color: '#facc15' });
          } else {
            gems.push({ x: e.x, y: e.y, exp: 2 });
          }

          for (let p = 0; p < (e.isBoss ? 24 : 6); p++) {
            const ang = Math.random() * Math.PI * 2;
            particles.push({
              x: e.x, y: e.y,
              vx: Math.cos(ang) * (e.isBoss ? 5 : 2.5),
              vy: Math.sin(ang) * (e.isBoss ? 5 : 2.5),
              life: e.isBoss ? 30 : 16,
              color: e.isBoss ? '#facc15' : '#f43f5e',
              size: e.isBoss ? 3 : 1.8
            });
          }
          enemies.splice(i, 1);
        }
      }

      // 6. 經驗晶體
      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const dist = Math.hypot(player.x - g.x, player.y - g.y);
        if (dist < 100) {
          const ang = Math.atan2(player.y - g.y, player.x - g.x);
          g.x += Math.cos(ang) * 5.5;
          g.y += Math.sin(ang) * 5.5;
        }
        if (dist < player.radius + 6) {
          STATE.exp += g.exp;
          AudioEngine.playGem();
          if (STATE.exp >= STATE.maxExp) {
            STATE.level++;
            STATE.exp -= STATE.maxExp;
            STATE.maxExp = Math.floor(STATE.maxExp * 1.35);
            showUpgradeModal();
          }
          gems.splice(i, 1);
        }
      }

      // 7. 粒子與飄字
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) {
        const pu = popups[i];
        pu.y -= 0.6;
        pu.life--;
        if (pu.life <= 0) popups.splice(i, 1);
      }

      // 8. 更新 DOM UI 與按鈕冷卻狀態
      document.getElementById('hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
      document.getElementById('exp-bar').style.width = `${(STATE.exp / STATE.maxExp) * 100}%`;
      document.getElementById('level-num').innerText = STATE.level;
      document.getElementById('kill-count').innerText = STATE.kills;

      const sec = Math.floor(STATE.gameTime / 60);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      document.getElementById('time-display').innerText = `${mm}:${ss}`;

      // 按鈕狀態反饋 (文字保持「回溯」，次數以右上角角標「1」「2」呈現)
      const echoLbl = document.getElementById('echo-lbl');
      const echoBadge = document.getElementById('echo-badge');
      if (player.echoCharges <= 0) {
        btnEcho.classList.add('disabled');
        echoLbl.innerText = `${(player.echoChargeTimer / 60).toFixed(1)}s`;
        if (echoBadge) echoBadge.style.display = 'none';
      } else {
        btnEcho.classList.remove('disabled');
        echoLbl.innerText = '回溯';
        if (echoBadge) {
          echoBadge.style.display = 'flex';
          echoBadge.innerText = player.echoCharges;
        }
      }

      if (echoes.length > 0) {
        btnSwap.classList.remove('disabled');
      } else {
        btnSwap.classList.add('disabled');
      }
    }

    // 幾何工具與數值計算
    function normalizeAngle(ang) {
      while (ang > Math.PI) ang -= Math.PI * 2;
      while (ang < -Math.PI) ang += Math.PI * 2;
      return ang;
    }

    function pointToSegmentDist(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    function isPointInPolygon(point, vs) {
      let x = point.x, y = point.y;
      let inside = false;
      for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        let xi = vs[i].x, yi = vs[i].y;
        let xj = vs[j].x, yj = vs[j].y;
        let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // 生成「重裝時空泰坦 Boss」
    function spawnBoss() {
      AudioEngine.playBossSpawn();
      STATE.shake = 12;
      popups.push({ x: width / 2, y: height / 2 - 50, text: 'BOSS INCOMING', life: 50, color: '#ef4444' });

      enemies.push({
        x: width / 2,
        y: -50,
        radius: 22, // 巨大體積
        speed: 1.6, // 提高基礎巡航移速 (原 0.65 -> 1.6)
        baseSpeed: 1.6,
        hp: 350 + Math.floor(STATE.gameTime / 600) * 100,
        maxHp: 350 + Math.floor(STATE.gameTime / 600) * 100,
        flash: 0,
        isBoss: true,
        hasShield: true,
        facingAngle: Math.PI / 2,
        // Boss 衝刺與轉向狀態機
        state: 'chase', // chase, windup, dash, cooldown
        stateTimer: 180, // 3秒後發動第一次大衝刺
        dashAngle: 0,
        dashSpeed: 5.5,
        turnRate: 0.04 // 轉向慣性，讓 Boss 轉頭不會瞬間完成
      });
    }

    // 觸發貫穿能量球撞擊本體之「超大範圍時空湮滅大爆炸」
    function triggerOrbSuperExplosion(ox, oy) {
      AudioEngine.playOrbExplode();
      STATE.shake = 15;
      const explodeRadius = 160; // 超大範圍

      popups.push({ x: ox, y: oy - 15, text: 'SUPER NOVA', life: 35, color: '#38bdf8' });

      // 對範圍內所有敵人（包含 Boss，且此大爆炸能直接穿透/瓦解護盾）造成巨大傷害
      for (const e of enemies) {
        const d = Math.hypot(e.x - ox, e.y - oy);
        if (d < explodeRadius) {
          const dmg = Math.floor(120 * (1 - d / explodeRadius) + 40);
          e.hp -= dmg;
          e.flash = 6;
          popups.push({ x: e.x, y: e.y - 10, text: dmg, life: 25, color: '#38bdf8' });
        }
      }

      // 產生壯觀的雙環擴散與粒子爆炸
      for (let i = 0; i < 36; i++) {
        const ang = (i / 36) * Math.PI * 2;
        const spd = 2.5 + Math.random() * 4.5;
        particles.push({
          x: ox,
          y: oy,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 25,
          color: i % 2 === 0 ? '#38bdf8' : '#facc15',
          size: 3
        });
      }
    }

    // --- 渲染畫面 ---
    function render() {
      ctx.save();
      if (STATE.shake > 0) {
        ctx.translate((Math.random() - 0.5) * STATE.shake, (Math.random() - 0.5) * STATE.shake);
        STATE.shake *= 0.88;
        if (STATE.shake < 0.5) STATE.shake = 0;
      }

      ctx.clearRect(0, 0, width, height);

      // 細緻背景網格 (縮小至 28px)
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.35)';
      ctx.lineWidth = 0.8;
      const gridSize = 28;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }

      // 1. 殘像結界與連線
      if (echoes.length >= 2) {
        ctx.save();
        ctx.fillStyle = 'rgba(236, 72, 153, 0.12)';
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 1.8;
        ctx.shadowColor = '#ec4899';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        for (const ec of echoes) {
          ctx.lineTo(ec.x, ec.y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      } else if (echoes.length === 1) {
        ctx.save();
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 2 + Math.sin(frameCount * 0.2) * 1;
        ctx.shadowColor = '#ec4899';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(echoes[0].x, echoes[0].y);
        ctx.stroke();
        ctx.restore();
      }

      // 殘像實體 (半徑 10px)
      for (const ec of echoes) {
        ctx.save();
        ctx.fillStyle = 'rgba(236, 72, 153, 0.45)';
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 1.8;
        ctx.shadowColor = '#ec4899';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(ec.x, ec.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // 2. 經驗晶體 (微型 2.8px)
      for (const g of gems) {
        ctx.save();
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(g.x, g.y, 2.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 3. 怪物與 Boss 渲染
      for (const e of enemies) {
        ctx.save();
        if (e.isBoss) {
          // Boss 霸體外殼
          ctx.fillStyle = e.flash > 0 ? '#fff' : '#881337';
          ctx.strokeStyle = '#f43f5e';
          ctx.lineWidth = 2.5;
          ctx.shadowColor = '#f43f5e';
          ctx.shadowBlur = e.flash > 0 ? 16 : 8;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Boss 內部核心晶片
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(e.x, e.y, 7, 0, Math.PI * 2);
          ctx.fill();

          // Boss 正面 160 度「高能能量護盾」渲染 (防禦正面攻擊)
          if (e.hasShield) {
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.rotate(e.facingAngle);
            ctx.beginPath();
            ctx.arc(0, 0, e.radius + 9, -Math.PI * 0.45, Math.PI * 0.45);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.9)';
            ctx.lineWidth = 3.5;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 12;
            ctx.stroke();

            // 護盾弧形光幕層
            ctx.fillStyle = 'rgba(56, 189, 248, 0.18)';
            ctx.lineTo(0, 0);
            ctx.fill();
            ctx.restore();
          }

          // Boss 頂部血條與標籤
          const barW = 44;
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(e.x - barW / 2, e.y - 32, barW, 5);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(e.x - barW / 2, e.y - 32, (e.hp / e.maxHp) * barW, 5);
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1;
          ctx.strokeRect(e.x - barW / 2, e.y - 32, barW, 5);

          ctx.font = 'bold 9px monospace';
          ctx.fillStyle = '#38bdf8';
          ctx.textAlign = 'center';
          ctx.fillText('TITAN BOSS', e.x, e.y - 36);
        } else {
          // 普通怪物
          ctx.fillStyle = e.flash > 0 ? '#fff' : '#f43f5e';
          ctx.strokeStyle = '#9f1239';
          ctx.lineWidth = 1.5;
          ctx.shadowColor = '#f43f5e';
          ctx.shadowBlur = e.flash > 0 ? 8 : 3;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          if (e.hp < e.maxHp) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(e.x - 9, e.y - 13, 18, 3);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(e.x - 9, e.y - 13, (e.hp / e.maxHp) * 18, 3);
          }
        }
        ctx.restore();
      }

      // 4. 貫穿時空能量球 (自轉脈衝光球)
      for (const orb of energyOrbs) {
        ctx.save();
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 14;
        // 外層引力光環
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius + Math.sin(frameCount * 0.25) * 2, 0, Math.PI * 2);
        ctx.stroke();

        // 核心高能等離子
        const grad = ctx.createRadialGradient(orb.x, orb.y, 2, orb.x, orb.y, orb.radius);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, '#38bdf8');
        grad.addColorStop(1, '#0284c7');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 5. 普通子彈 (2.5px)
      for (const b of bullets) {
        ctx.save();
        ctx.fillStyle = b.isEcho ? '#ec4899' : '#38bdf8';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 5. 軌道光刃
      if (player.orbitalBlade > 0) {
        const bladeDist = 40;
        for (let b = 0; b < player.orbitalBlade; b++) {
          const ang = player.bladeAngle + (b * (Math.PI * 2 / player.orbitalBlade));
          const bx = player.x + Math.cos(ang) * bladeDist;
          const by = player.y + Math.sin(ang) * bladeDist;
          ctx.save();
          ctx.fillStyle = '#facc15';
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(bx, by, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // 6. 3 秒前「時空回溯預覽殘像」 (Ghost Preview)
      // 讓玩家清晰預見按下「回溯」後的瞬移著陸點與過去殘影
      if (player.history.length >= 15 && player.echoCharges > 0) {
        const previewState = player.history[0];
        ctx.save();
        
        // 本體到 3 秒前殘像之間的量子連繫虛線
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(previewState.x, previewState.y);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.stroke();

        // 3 秒前淺色半透明虛影本體 (動態呼吸微光)
        const pulse = 0.35 + Math.sin(frameCount * 0.15) * 0.15;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(previewState.x, previewState.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 中心時空錨點
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(previewState.x, previewState.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // 7. 玩家本體 (半徑 10px)
      ctx.save();
      if (player.invulnerable > 0 && Math.floor(frameCount / 4) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }
      ctx.fillStyle = '#38bdf8';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 7. 粒子效果
      for (const p of particles) {
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 20;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 8. 傷害飄字
      for (const pu of popups) {
        ctx.save();
        ctx.font = 'bold 11px monospace';
        ctx.fillStyle = pu.color;
        ctx.globalAlpha = pu.life / 20;
        ctx.fillText(`-${pu.text}`, pu.x, pu.y);
        ctx.restore();
      }

      ctx.restore();
    }

    function gameOver() {
      STATE.isGameOver = true;
      const modal = document.getElementById('gameover-modal');
      const sec = Math.floor(STATE.gameTime / 60);
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      document.getElementById('final-time').innerText = `${mm}:${ss}`;
      document.getElementById('final-kills').innerText = STATE.kills;
      modal.classList.add('active');
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
