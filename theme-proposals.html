<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>⏳ AFTERIMAGE - 光球共振與幾何連線首頁設計</title>
  <!-- 引入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Orbitron:wght@800;900&family=Syne:wght@800;900&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #04020a;
      color: #fff;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* 頂部切換工具列 */
    .style-switcher {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(8, 6, 15, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.8);
    }
    .switcher-title {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .switcher-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .theme-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .theme-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      transform: translateY(-1px);
    }
    .theme-btn.active {
      background: #38bdf8;
      color: #020813;
      border-color: #7dd3fc;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.7);
    }

    /* 說明提示條 */
    .style-info-bar {
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px 24px;
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: #94a3b8;
    }
    .badge-tag {
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* 主展示 Stage */
    .stage-container {
      flex: 1;
      width: 100%;
      min-height: calc(100vh - 120px);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 40px 20px;
    }

    /* 背景動態 Canvas（渲染光球與殘像連線幾何） */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 內容容器 */
    .preview-box {
      text-align: center;
      position: relative;
      z-index: 2;
      max-width: 820px;
      transition: all 0.3s;
    }

    /* =========================================================
       THEME 1: 🌌 幾何共振三芒星 (Resonance Convex Trinity) - 推薦旗艦
       ========================================================= */
    body.theme-resonance-trinity {
      background: #05020c;
    }
    .theme-resonance-trinity .version-pill {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 18px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 24px;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.2);
    }
    .theme-resonance-trinity .logo-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 16px;
    }
    .theme-resonance-trinity .game-logo-main {
      font-family: 'Syne', sans-serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 16px;
      padding-left: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 40%, #38bdf8 80%, #0284c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 28px rgba(56, 189, 248, 0.7));
    }
    .theme-resonance-trinity .game-desc {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      color: #c084fc;
      letter-spacing: 4px;
      margin-bottom: 40px;
      text-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
    }
    .theme-resonance-trinity .btn-start-demo {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      color: #04020a;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 4px;
      padding: 16px 58px;
      border-radius: 999px;
      border: 1.5px solid #fff;
      cursor: pointer;
      box-shadow: 0 0 36px rgba(56, 189, 248, 0.8);
      transition: all 0.2s;
    }
    .theme-resonance-trinity .btn-start-demo:hover {
      transform: scale(1.06);
      box-shadow: 0 0 55px rgba(56, 189, 248, 1);
    }

    /* =========================================================
       THEME 2: ⚡ 賽博雷射切割 (Cyber Laser Cleave)
       ========================================================= */
    body.theme-cyber-laser {
      background: #090118;
      font-family: 'Orbitron', monospace;
    }
    .theme-cyber-laser .preview-box {
      border: 1.5px solid rgba(236, 72, 153, 0.5);
      background: rgba(9, 1, 24, 0.85);
      backdrop-filter: blur(16px);
      padding: 44px 60px;
      box-shadow: 0 0 40px rgba(236, 72, 153, 0.3), inset 0 0 20px rgba(56, 189, 248, 0.2);
      clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px));
    }
    .theme-cyber-laser .version-pill {
      font-size: 11px;
      background: #ec4899;
      color: #fff;
      padding: 4px 14px;
      display: inline-block;
      margin-bottom: 20px;
    }
    .theme-cyber-laser .game-logo-main {
      font-family: 'Montserrat', sans-serif;
      font-style: italic;
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 10px;
      color: #38bdf8;
      text-shadow: 3px 3px 0px #ec4899, -2px -2px 0px #fff;
      margin-bottom: 12px;
    }
    .theme-cyber-laser .game-desc {
      font-size: 12px;
      color: #ec4899;
      letter-spacing: 3px;
      margin-bottom: 34px;
    }
    .theme-cyber-laser .btn-start-demo {
      background: #38bdf8;
      color: #090118;
      font-family: 'Orbitron', monospace;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 3px;
      padding: 14px 48px;
      border: none;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      box-shadow: 5px 5px 0px #ec4899;
      cursor: pointer;
      transition: all 0.15s;
    }
    .theme-cyber-laser .btn-start-demo:hover {
      transform: translate(-3px, -3px);
      box-shadow: 8px 8px 0px #ec4899;
      background: #fff;
    }

    /* =========================================================
       THEME 3: 📐 軍規機甲標定 HUD (Mecha Reticle HUD)
       ========================================================= */
    body.theme-mecha-reticle {
      background: #080c14;
      font-family: 'Teko', sans-serif;
    }
    .theme-mecha-reticle .preview-box {
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(8, 12, 20, 0.9);
      padding: 40px 70px;
      position: relative;
    }
    .theme-mecha-reticle .preview-box::before {
      content: "[ CHRONO-ORB SYNCHRONIZER v0.0.9 ]";
      position: absolute;
      top: -10px;
      left: 20px;
      background: #080c14;
      padding: 0 10px;
      font-size: 11px;
      color: #38bdf8;
      letter-spacing: 2px;
    }
    .theme-mecha-reticle .version-pill {
      font-size: 14px;
      color: #facc15;
      letter-spacing: 2px;
      margin-bottom: 10px;
      display: inline-block;
    }
    .theme-mecha-reticle .game-logo-main {
      font-size: 74px;
      font-weight: 700;
      letter-spacing: 12px;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 8px;
      border-bottom: 2px solid #38bdf8;
      padding-bottom: 10px;
    }
    .theme-mecha-reticle .game-desc {
      font-size: 18px;
      color: #94a3b8;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }
    .theme-mecha-reticle .btn-start-demo {
      background: #38bdf8;
      color: #080c14;
      font-family: 'Teko', sans-serif;
      font-size: 24px;
      letter-spacing: 3px;
      padding: 8px 44px;
      border: 1px solid #fff;
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-mecha-reticle .btn-start-demo:hover {
      background: #facc15;
      color: #000;
    }

    /* =========================================================
       THEME 4: 💎 極致毛玻璃懸浮 (Glassmorphism Float)
       ========================================================= */
    body.theme-glass-float {
      background: #030612;
    }
    .theme-glass-float .preview-box {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 36px;
      padding: 48px 60px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.25);
    }
    .theme-glass-float .version-pill {
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 4px 16px;
      display: inline-block;
      margin-bottom: 20px;
    }
    .theme-glass-float .game-logo-main {
      font-family: 'Montserrat', sans-serif;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 12px;
      padding-left: 12px;
      background: linear-gradient(135deg, #38bdf8 0%, #a855f7 50%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
    }
    .theme-glass-float .game-desc {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 36px;
      letter-spacing: 2px;
    }
    .theme-glass-float .btn-start-demo {
      background: linear-gradient(135deg, #0284c7 0%, #9333ea 100%);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 16px 56px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(147, 51, 234, 0.4);
      transition: all 0.2s;
    }
    .theme-glass-float .btn-start-demo:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(147, 51, 234, 0.7);
    }

    /* =========================================================
       THEME 5: 🏛️ 古典時間編織 (Chrono Loom Tapestry)
       ========================================================= */
    body.theme-chrono-loom {
      background: #080604;
      font-family: 'Cinzel', serif;
    }
    .theme-chrono-loom .version-pill {
      font-size: 11px;
      letter-spacing: 4px;
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 3px 18px;
      display: inline-block;
      margin-bottom: 24px;
    }
    .theme-chrono-loom .game-logo-main {
      font-size: 58px;
      font-weight: 900;
      letter-spacing: 16px;
      padding-left: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #fef08a 40%, #d4af37 80%, #854d0e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 24px rgba(212, 175, 55, 0.6));
      margin-bottom: 16px;
    }
    .theme-chrono-loom .game-desc {
      font-size: 13px;
      color: #a38942;
      letter-spacing: 4px;
      margin-bottom: 40px;
    }
    .theme-chrono-loom .btn-start-demo {
      background: #d4af37;
      color: #080604;
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 3px;
      padding: 14px 48px;
      border: 1px solid #fff;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
      transition: all 0.2s;
    }
    .theme-chrono-loom .btn-start-demo:hover {
      background: #fff;
      box-shadow: 0 0 45px rgba(212, 175, 55, 0.9);
    }

    /* =========================================================
       THEME 6: ⚔️ 深紅裂變殺陣 (Crimson Fission Array)
       ========================================================= */
    body.theme-crimson-fission {
      background: #0d0205;
    }
    .theme-crimson-fission .preview-box {
      border: 1.5px solid rgba(239, 68, 68, 0.4);
      background: rgba(20, 3, 7, 0.85);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 44px 56px;
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
    }
    .theme-crimson-fission .version-pill {
      font-size: 11px;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 999px;
      padding: 4px 14px;
      display: inline-block;
      margin-bottom: 20px;
    }
    .theme-crimson-fission .game-logo-main {
      font-family: 'Montserrat', sans-serif;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 12px;
      padding-left: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #fca5a5 40%, #ef4444 80%, #7f1d1d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 24px rgba(239, 68, 68, 0.7));
      margin-bottom: 12px;
    }
    .theme-crimson-fission .game-desc {
      font-size: 14px;
      color: #f87171;
      letter-spacing: 2.5px;
      margin-bottom: 34px;
    }
    .theme-crimson-fission .btn-start-demo {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 16px 54px;
      border-radius: 999px;
      border: 1px solid rgba(254, 202, 202, 0.4);
      cursor: pointer;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.7);
    }
  </style>
</head>
<body class="theme-resonance-trinity">

  <!-- 頂部即時切換導航列 -->
  <div class="style-switcher">
    <div class="switcher-title">
      <span>⏳ AFTERIMAGE 光球共振首頁設計</span>
      <span class="badge-tag" id="current-theme-name">#1 🌌 幾何共振三芒星 (旗艦推薦)</span>
    </div>
    <div class="switcher-pills">
      <button class="theme-btn active" onclick="setTheme('theme-resonance-trinity', '#1 🌌 幾何共振三芒星 (旗艦推薦)', '青色本體光球 + 紫色雙殘像三角結界、Syne 寬體光雕字標、時空微粒共鳴')">#1 🌌 幾何共振三芒星 (推薦)</button>
      <button class="theme-btn" onclick="setTheme('theme-cyber-laser', '#2 ⚡ 賽博雷射切割', '青色光球與桃紅殘像強烈雷射切割連線、幾何全息斜切面板')">#2 ⚡ 賽博雷射切割</button>
      <button class="theme-btn" onclick="setTheme('theme-mecha-reticle', '#3 📐 軍規機甲標定 HUD', '戰術準星鎖定、Teko 硬核工業字體、時空座標標定框')">#3 📐 軍規機甲標定 HUD</button>
      <button class="theme-btn" onclick="setTheme('theme-glass-float', '#4 💎 極致毛玻璃懸浮', '28px 超通透毛玻璃圓角、極光漸層光球、現代輕奢質感')">#4 💎 極致毛玻璃懸浮</button>
      <button class="theme-btn" onclick="setTheme('theme-chrono-loom', '#5 🏛️ 古典時間編織', '金色時間之光光球連線、Cinzel 羅馬神話雕刻字標')">#5 🏛️ 古典時間編織</button>
      <button class="theme-btn" onclick="setTheme('theme-crimson-fission', '#6 ⚔️ 深紅裂變殺陣', '深紅高壓裂變光球、血月雷射連線與熱血戰意殺陣')">#6 ⚔️ 深紅裂變殺陣</button>
    </div>
  </div>

  <div class="style-info-bar">
    <div id="theme-desc">青色本體光球 + 紫色雙殘像三角結界、Syne 寬體光雕字標、時空微粒共鳴。</div>
    <div>背景即時運行 Canvas 實體光球與殘像連線物理軌道，直接回覆編號即可全域實裝！</div>
  </div>

  <!-- 主展示舞台 (內嵌即時物理光球連線 Canvas) -->
  <div class="stage-container">
    <canvas id="bg-canvas"></canvas>

    <div class="preview-box">
      <div class="version-pill">RELEASE v0.0.9</div>
      
      <div class="logo-wrap">
        <div class="game-logo-main">AFTERIMAGE</div>
      </div>

      <div class="game-desc">REWIND THE TIMELINE × ECHO SYNERGY × CONVEX HULL RESONANCE</div>

      <button class="btn-start-demo" onclick="alert('🎮 確認風格後，點擊將直接進入戰鬥！')">START GAME</button>
    </div>
  </div>

  <script>
    // --- Canvas 動態光球與殘像連線幾何渲染器 ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width = 0, height = 0;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 實體光球 (本體 + 2 個殘像)
    let time = 0;
    let currentTheme = 'theme-resonance-trinity';

    // 時空能量浮動粒子
    const particles = Array.from({ length: 35 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.8,
      vy: (Math.random() - 0.5) * 0.8,
      size: Math.random() * 2.5 + 1,
      alpha: Math.random() * 0.6 + 0.2
    }));

    function renderBackground() {
      ctx.clearRect(0, 0, width, height);
      time += 0.02;

      const cx = width / 2;
      const cy = height / 2;
      const radiusX = Math.min(width * 0.35, 320);
      const radiusY = Math.min(height * 0.28, 180);

      // 1. 本體光球座標 (橢圓軌跡平滑環繞)
      const pMain = {
        x: cx + Math.cos(time) * radiusX,
        y: cy + Math.sin(time * 1.2) * radiusY
      };

      // 2. 殘像 1 座標 (時間延遲相位差)
      const pEcho1 = {
        x: cx + Math.cos(time - 1.8) * radiusX,
        y: cy + Math.sin((time - 1.8) * 1.2) * radiusY
      };

      // 3. 殘像 2 座標 (更早的時間相位差)
      const pEcho2 = {
        x: cx + Math.cos(time - 3.6) * radiusX,
        y: cy + Math.sin((time - 3.6) * 1.2) * radiusY
      };

      // 依主題決定色彩配置
      let mainColor = '#38bdf8';
      let echoColor = '#a855f7';
      let fillColor = 'rgba(168, 85, 247, 0.06)';
      let lineColor = 'rgba(56, 189, 248, 0.6)';

      if (currentTheme === 'theme-cyber-laser') {
        mainColor = '#00ffcc';
        echoColor = '#ff007f';
        fillColor = 'rgba(255, 0, 127, 0.08)';
        lineColor = 'rgba(0, 255, 204, 0.7)';
      } else if (currentTheme === 'theme-mecha-reticle') {
        mainColor = '#38bdf8';
        echoColor = '#facc15';
        fillColor = 'rgba(56, 189, 248, 0.05)';
        lineColor = 'rgba(56, 189, 248, 0.5)';
      } else if (currentTheme === 'theme-chrono-loom') {
        mainColor = '#fef08a';
        echoColor = '#d4af37';
        fillColor = 'rgba(212, 175, 55, 0.08)';
        lineColor = 'rgba(212, 175, 55, 0.6)';
      } else if (currentTheme === 'theme-crimson-fission') {
        mainColor = '#fca5a5';
        echoColor = '#ef4444';
        fillColor = 'rgba(239, 68, 68, 0.08)';
        lineColor = 'rgba(239, 68, 68, 0.6)';
      }

      // --- A. 繪製封閉共振結界三角形面 ---
      ctx.beginPath();
      ctx.moveTo(pMain.x, pMain.y);
      ctx.lineTo(pEcho1.x, pEcho1.y);
      ctx.lineTo(pEcho2.x, pEcho2.y);
      ctx.closePath();
      ctx.fillStyle = fillColor;
      ctx.fill();

      // --- B. 繪製共振連線 (高能雷射) ---
      ctx.lineWidth = 2;
      ctx.strokeStyle = lineColor;
      ctx.shadowColor = lineColor;
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 虛線回溯軌跡線 (從本體連結過去軌跡)
      ctx.beginPath();
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 40; i++) {
        const t = time - (i / 40) * 3.6;
        const tx = cx + Math.cos(t) * radiusX;
        const ty = cy + Math.sin(t * 1.2) * radiusY;
        if (i === 0) ctx.moveTo(tx, ty);
        else ctx.lineTo(tx, ty);
      }
      ctx.stroke();
      ctx.setLineDash([]);

      // --- C. 繪製粒子 ---
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * 0.4})`;
        ctx.fill();
      });

      // --- D. 繪製殘像光球 (Echo Orbs) ---
      [pEcho1, pEcho2].forEach((echo, idx) => {
        // 外層光暈
        ctx.beginPath();
        ctx.arc(echo.x, echo.y, 16, 0, Math.PI * 2);
        ctx.fillStyle = echoColor;
        ctx.globalAlpha = 0.25;
        ctx.fill();

        // 核心光球
        ctx.beginPath();
        ctx.arc(echo.x, echo.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = echoColor;
        ctx.globalAlpha = 0.85;
        ctx.shadowColor = echoColor;
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;
      });

      // --- E. 繪製本體光球 (Main Player Orb) ---
      // 巨大外層脈衝光環
      const pulseSize = 22 + Math.sin(time * 4) * 3;
      ctx.beginPath();
      ctx.arc(pMain.x, pMain.y, pulseSize, 0, Math.PI * 2);
      ctx.fillStyle = mainColor;
      ctx.globalAlpha = 0.2;
      ctx.fill();

      // 核心光球
      ctx.beginPath();
      ctx.arc(pMain.x, pMain.y, 11, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = mainColor;
      ctx.shadowBlur = 24;
      ctx.globalAlpha = 1.0;
      ctx.fill();
      ctx.shadowBlur = 0;

      requestAnimationFrame(renderBackground);
    }
    renderBackground();

    // 切換主題控制器
    function setTheme(themeClass, name, desc) {
      document.body.className = themeClass;
      currentTheme = themeClass;
      document.getElementById('current-theme-name').innerText = name;
      document.getElementById('theme-desc').innerText = desc;
      
      const buttons = document.querySelectorAll('.theme-btn');
      buttons.forEach(btn => {
        if (btn.getAttribute('onclick').includes(themeClass)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }
  </script>
</body>
</html>
